<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | Game Maker Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(15, 15, 15, 0.95); --accent: #3498db; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: 'Segoe UI', sans-serif; }
        
        /* القوائم العائمة */
        .panel { position: absolute; background: var(--glass); padding: 12px; border-radius: 10px; border: 1px solid #333; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
        .top-left { top: 10px; left: 10px; width: 220px; }
        .top-right { top: 10px; right: 10px; width: 240px; }
        .bottom-right { bottom: 10px; right: 10px; width: 240px; }
        .top-center { top: 10px; left: 50%; transform: translateX(-50%); flex-direction: row; }

        .btn { background: #222; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: 0.2s; text-align: center; }
        .btn:hover { background: var(--primary); color: #000; }
        .btn.active { background: var(--accent); color: white; border-color: #fff; }
        .play-btn { background: #27ae60; color: white; font-weight: bold; width: 120px; }
        
        .label { font-size: 10px; color: var(--primary); font-weight: bold; text-transform: uppercase; margin-top: 5px; }
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        select { background: #111; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; }
        
        #viewport { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div class="panel top-center">
        <button class="btn play-btn" id="playBtn" onclick="togglePlay()">▶ تشغيل اللعبة</button>
        <button class="btn" onclick="resetEditor()">⏹ إنهاء</button>
    </div>

    <div class="panel top-left">
        <span class="label">إضافة عناصر العالم</span>
        <select onchange="addItem(this.value); this.value='';">
            <option value="">+ إضافة مجسم/إضاءة</option>
            <option value="cube">📦 مكعب صلب</option>
            <option value="sphere">🔮 كرة</option>
            <option value="sun">☀️ شمس (ضوء اتجاهي)</option>
            <option value="point">💡 ضوء نقطي (مصباح)</option>
            <option value="game_cam">🎥 كاميرا تصوير اللعبة</option>
        </select>

        <span class="label">الطبيعة</span>
        <button class="btn" onclick="addNature('tree_oak')">🌳 شجرة بلوط</button>
        <button class="btn" onclick="addNature('tree_palm')">🌴 نخلة</button>
        <button class="btn" onclick="addNature('grass')">🌱 أعشاب</button>
        <button class="btn" onclick="addWater()">💧 إضافة بحيرة مائية</button>

        <span class="label">نوع الأرض</span>
        <button class="btn" onclick="changeGround('flat')">🟩 مسطحة</button>
        <button class="btn" onclick="changeGround('sand')">🏜️ رملية</button>
    </div>

    <div class="panel top-right">
        <span class="label">أدوات النحت (Sculpt)</span>
        <button class="btn" id="sculpt_up" onclick="setTool('sculpt_up')">🔼 رفع الأرض (تلال)</button>
        <button class="btn" id="sculpt_down" onclick="setTool('sculpt_down')">🔽 حفر الأرض (وديان)</button>
        
        <span class="label">فرشاة التلوين</span>
        <input type="color" id="paintColor" value="#deff9a" style="width:100%">
        <button class="btn" id="paint_tool" onclick="setTool('paint')">🖌️ تلوين المجسمات</button>
        
        <span class="label">حجم الفرشاة</span>
        <input type="range" id="brushSize" min="1" max="10" value="3">
    </div>

    <div class="panel bottom-right">
        <span class="label">محاكي البيئة</span>
        <label style="font-size:10px">قوة الرياح:</label>
        <input type="range" id="windRange" min="0" max="100" value="20">
        <label style="font-size:10px">سطوع الشمس:</label>
        <input type="range" id="sunRange" min="0" max="200" value="100">
        <hr style="border:0; border-top:1px solid #333">
        <div id="status" style="font-size:11px; color:#888">جاهز...</div>
        <button class="btn" onclick="deleteObj()" style="background:#631313; margin-top:5px">حذف المختار</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, editorCam, gameCam, renderer, orbit, transform, raycaster, mouse;
    let ground, groundGeo, sunLight;
    let objects = [], windObjs = [], isPlaying = false;
    let activeTool = null;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        
        editorCam = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        editorCam.position.set(20, 20, 20);
        camera = editorCam;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(50, 50, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        orbit = new THREE.OrbitControls(editorCam, renderer.domElement);
        transform = new THREE.TransformControls(editorCam, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        // إنشاء الأرضية للنحت (Grid High Res)
        groundGeo = new THREE.PlaneGeometry(100, 100, 100, 100);
        ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({color: 0x224422, wireframe: false}));
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);

        window.addEventListener('mousedown', onMouseDown);
        animate();
    }

    function setTool(tool) {
        activeTool = (activeTool === tool) ? null : tool;
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if(activeTool) document.getElementById(tool).classList.add('active');
    }

    function onMouseDown(e) {
        if(e.target.tagName !== 'CANVAS' || isPlaying) return;
        mouse.x = (e.clientX/window.innerWidth)*2-1;
        mouse.y = -(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse, camera);

        const groundIntersect = raycaster.intersectObject(ground);
        const objIntersects = raycaster.intersectObjects(objects, true);

        // أدوات النحت
        if((activeTool === 'sculpt_up' || activeTool === 'sculpt_down') && groundIntersect.length > 0) {
            sculptGround(groundIntersect[0].point, activeTool);
            return;
        }

        // أداة التلوين
        if(activeTool === 'paint' && objIntersects.length > 0) {
            let target = objIntersects[0].object;
            target.material.color.set(document.getElementById('paintColor').value);
            return;
        }

        // اختيار وتحريك
        if(objIntersects.length > 0) {
            let target = objIntersects[0].object;
            while(target.parent && target.parent !== scene) target = target.parent;
            transform.attach(target);
            document.getElementById('status').innerText = "مختار: " + target.name;
        } else {
            transform.detach();
        }
    }

    function sculptGround(point, tool) {
        const pos = groundGeo.attributes.position;
        const radius = document.getElementById('brushSize').value;
        const strength = tool === 'sculpt_up' ? 0.5 : -0.5;

        for(let i=0; i<pos.count; i++) {
            let vx = pos.getX(i), vy = pos.getY(i);
            // تحويل إحداثيات الأرض لمتجهات العالم
            let dist = Math.sqrt(Math.pow(vx - point.x, 2) + Math.pow(-vy - point.z, 2));
            if(dist < radius) {
                pos.setZ(i, pos.getZ(i) + (strength * (1 - dist/radius)));
            }
        }
        pos.needsUpdate = true;
    }

    function addItem(type) {
        let obj;
        if(type === 'cube') obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0x888888}));
        if(type === 'game_cam') {
            obj = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(1,1,2), new THREE.MeshBasicMaterial({color: 0xff0000}));
            obj.add(body);
            gameCam = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            obj.add(gameCam);
            obj.name = "GameCamera";
        }
        if(obj) {
            obj.position.set(0, 2, 0);
            scene.add(obj);
            objects.push(obj);
            transform.attach(obj);
        }
    }

    function addNature(type) {
        let group = new THREE.Group();
        if(type.includes('tree')) {
            let trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 3), new THREE.MeshStandardMaterial({color: 0x4d2600}));
            let leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshStandardMaterial({color: 0x116611}));
            leaves.position.y = 3;
            group.add(trunk, leaves);
            windObjs.push(group);
        }
        group.position.set(Math.random()*10-5, 0, Math.random()*10-5);
        scene.add(group);
        objects.push(group);
    }

    function addWater() {
        let water = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({color: 0x00aaff, transparent: true, opacity: 0.7}));
        water.rotation.x = -Math.PI/2;
        water.position.y = 0.5;
        scene.add(water);
        objects.push(water);
    }

    function togglePlay() {
        if(!gameCam) { alert("من فضلك أضف كاميرا اللعبة أولاً!"); return; }
        isPlaying = !isPlaying;
        if(isPlaying) {
            camera = gameCam;
            transform.detach();
            document.getElementById('playBtn').innerText = "⏸ إيقاف";
        } else {
            camera = editorCam;
            document.getElementById('playBtn').innerText = "▶ تشغيل اللعبة";
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        let time = Date.now() * 0.002;
        let wind = document.getElementById('windRange').value / 1000;
        
        windObjs.forEach(o => {
            o.rotation.x = Math.sin(time) * wind;
            o.rotation.z = Math.cos(time) * wind;
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
