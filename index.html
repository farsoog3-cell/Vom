<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine Pro | Ultimate Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(20, 20, 20, 0.85); --border: rgba(222, 255, 154, 0.3); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050505; color: white; font-family: sans-serif; }
        
        /* تصميم أيقونات الزوايا */
        .corner-panel {
            position: absolute; background: var(--glass); padding: 15px; border-radius: 15px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        
        .top-left { top: 20px; left: 20px; }   /* أدوات التعديل (تحريك/تدوير) */
        .top-right { top: 20px; right: 20px; } /* إضافة عناصر (شجر/أرض/شمس) */
        .bottom-left { bottom: 20px; left: 20px; } /* حالة الكائن المختار */
        .bottom-right { bottom: 20px; right: 20px; } /* نوع المادة (صلب/قماش) */

        .icon-btn {
            background: #222; border: 1px solid #444; color: white; padding: 10px;
            border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .icon-btn:hover { background: var(--primary); color: black; }
        .icon-btn.active { background: var(--primary); color: black; border-color: white; }

        #viewport { width: 100vw; height: 100vh; }
        .label { font-size: 10px; color: var(--primary); text-transform: uppercase; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="corner-panel top-left">
        <span class="label">أدوات التحكم</span>
        <button class="icon-btn active" id="btn-t" onclick="setMode('translate')">Transform (G)</button>
        <button class="icon-btn" id="btn-r" onclick="setMode('rotate')">Rotate (R)</button>
        <button class="icon-btn" id="btn-s" onclick="setMode('scale')">Scale (S)</button>
    </div>

    <div class="corner-panel top-right">
        <span class="label">إضافة للعالم</span>
        <button class="icon-btn" onclick="addGround()">🟩 أرضية</button>
        <button class="icon-btn" onclick="addTree()">🌳 شجرة</button>
        <button class="icon-btn" onclick="addSun()">☀️ شمس وظل</button>
        <button class="icon-btn" onclick="addShape('cube')">📦 مكعب</button>
        <button class="icon-btn" onclick="addShape('sphere')">🔮 كرة</button>
    </div>

    <div class="corner-panel bottom-left">
        <span class="label">بيانات العنصر</span>
        <div id="pos-info" style="font-family: monospace; font-size: 12px;">X:0 Y:0 Z:0</div>
        <input type="color" id="color-p" oninput="updateColor(this.value)" style="width:100%; height:25px; cursor:pointer;">
        <button class="icon-btn" style="background:#441111;" onclick="deleteObj()">حذف</button>
    </div>

    <div class="corner-panel bottom-right">
        <span class="label">نوع المادة</span>
        <button class="icon-btn active" id="p-solid" onclick="setPhys('solid')">صلب (Solid)</button>
        <button class="icon-btn" id="p-rubber" onclick="setPhys('rubber')">مطاط (Rubber)</button>
        <button class="icon-btn" id="p-cloth" onclick="setPhys('cloth')">قماش (Cloth)</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, raycaster, mouse;
    let selectedObj = null;
    let objects = [];

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // --- إعادة الشبكة والضوء الأساسي ---
        const grid = new THREE.GridHelper(30, 30, 0x333333, 0x222222);
        scene.add(grid);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        window.addEventListener('mousedown', (e) => {
            if(e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, true);
            if(intersects.length > 0) select(intersects[0].object);
        });

        // إضافة المكعب الأساسي الذي كان موجوداً
        addShape('cube');

        animate();
    }

    // وظائف الإضافة
    function addGround() {
        const geo = new THREE.BoxGeometry(40, 0.2, 40);
        const mat = new THREE.MeshStandardMaterial({ color: 0x1a3311 });
        const g = new THREE.Mesh(geo, mat);
        g.receiveShadow = true;
        scene.add(g);
        objects.push(g);
    }

    function addTree() {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), new THREE.MeshStandardMaterial({color: 0x4d2600}));
        const leaves = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshStandardMaterial({color: 0x006400}));
        trunk.position.y = 1; leaves.position.y = 2.5;
        group.add(trunk, leaves);
        group.position.set(Math.random()*10-5, 0, Math.random()*10-5);
        scene.add(group);
        objects.push(trunk, leaves);
    }

    function addSun() {
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        light.castShadow = true;
        scene.add(light);
        scene.background = new THREE.Color(0x87ceeb); // تحويل السماء لنهار
    }

    function addShape(type) {
        let geo = (type === 'cube') ? new THREE.BoxGeometry(2,2,2) : new THREE.SphereGeometry(1.5, 32, 32);
        let mat = new THREE.MeshStandardMaterial({ color: 0xdeff9a });
        let mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 1;
        mesh.castShadow = true;
        scene.add(mesh);
        objects.push(mesh);
        select(mesh);
    }

    function select(obj) {
        selectedObj = obj;
        transform.attach(obj);
        document.getElementById('color-p').value = "#" + obj.material.color.getHexString();
    }

    function setMode(mode) {
        transform.setMode(mode);
        document.querySelectorAll('.top-left .icon-btn').forEach(b => b.classList.remove('active'));
        if(mode === 'translate') document.getElementById('btn-t').classList.add('active');
        if(mode === 'rotate') document.getElementById('btn-r').classList.add('active');
        if(mode === 'scale') document.getElementById('btn-s').classList.add('active');
    }

    function setPhys(type) {
        if(!selectedObj) return;
        document.querySelectorAll('.bottom-right .icon-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('p-' + type).classList.add('active');
        
        if(type === 'rubber') { selectedObj.material.roughness = 0.1; selectedObj.material.wireframe = false; }
        else if(type === 'cloth') { selectedObj.material.wireframe = true; }
        else { selectedObj.material.wireframe = false; selectedObj.material.roughness = 0.5; }
    }

    function updateColor(val) { if(selectedObj) selectedObj.material.color.set(val); }
    
    function deleteObj() { if(selectedObj) { scene.remove(selectedObj); transform.detach(); selectedObj = null; } }

    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
        if(selectedObj) {
            const p = selectedObj.position;
            document.getElementById('pos-info').innerText = `X:${p.x.toFixed(1)} Y:${p.y.toFixed(1)} Z:${p.z.toFixed(1)}`;
        }
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
