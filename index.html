<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo-Engine Pro | Ultimate Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --bg: rgba(15, 15, 15, 0.95); --border: rgba(222, 255, 154, 0.3); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }

        /* منطقة العرض */
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* لوحة التحكم الجانبية - تم تصغيرها وجعلها شفافة لتسمح بالعمل */
        .sidebar {
            position: absolute; right: 10px; top: 70px; width: 220px;
            max-height: calc(100vh - 100px); overflow-y: auto; background: var(--bg);
            border: 1px solid var(--border); border-radius: 15px;
            padding: 12px; z-index: 100; backdrop-filter: blur(10px);
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }

        .sidebar-title { font-size: 14px; color: var(--primary); margin-bottom: 10px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 5px; }

        .category { margin-bottom: 8px; }
        .category-toggle {
            width: 100%; padding: 8px 12px; background: #222; border: 1px solid #333;
            color: #fff; text-align: right; cursor: pointer; border-radius: 8px; font-size: 13px;
        }
        .category-content { display: none; flex-direction: column; gap: 4px; padding: 8px 5px; background: rgba(0,0,0,0.2); }
        .category-content.active { display: flex; }
        .category-content button {
            background: #2a2a2a; border: 1px solid #444; color: #ddd; padding: 6px;
            border-radius: 5px; cursor: pointer; font-size: 12px; text-align: right;
        }
        .category-content button:hover { background: var(--primary); color: #000; }

        /* أزرار الوضع */
        .mode-selector {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 200; background: var(--bg); padding: 5px; border-radius: 30px; border: 1px solid var(--border);
        }
        .mode-btn { padding: 6px 18px; border-radius: 20px; border: none; background: transparent; color: #888; cursor: pointer; transition: 0.3s; }
        .mode-btn.active { background: var(--primary); color: #000; font-weight: bold; }

        .delete-btn { width: 100%; margin-top: 10px; padding: 8px; background: #422; color: #f55; border: 1px solid #622; border-radius: 8px; cursor: pointer; }
        
        /* إخفاء السكرول بار */
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="mode-selector">
        <button class="mode-btn active" id="btn-edit" onclick="toggleViewMode(false)">وضع البناء</button>
        <button class="mode-btn" id="btn-view" onclick="toggleViewMode(true)">وضع الرؤية</button>
    </div>

    <div id="editor-ui" class="sidebar">
        <div class="sidebar-title">أدوات التصميم</div>

        <div class="category">
            <button class="category-toggle" onclick="toggleCat('cat-trees')">🌳 الأشجار</button>
            <div id="cat-trees" class="category-content">
                <button onclick="spawn('tree', 'oak')">شجر بلوط</button>
                <button onclick="spawn('tree', 'pine')">صنوبر</button>
                <button onclick="spawn('tree', 'palm')">نخلة</button>
            </div>
        </div>

        <div class="category">
            <button class="category-toggle" onclick="toggleCat('cat-light')">☀️ الإضاءة</button>
            <div id="cat-light" class="category-content">
                <button onclick="setEnv('noon')">إضاءة الظهر</button>
                <button onclick="setEnv('sunset')">وقت الغروب</button>
                <button onclick="selectSun()">تحريك الشمس</button>
            </div>
        </div>

        <div class="category">
            <button class="category-toggle" onclick="toggleCat('cat-water')">🌊 المياه</button>
            <div id="cat-water" class="category-content">
                <button onclick="setWater('ocean')">محيط أزرق</button>
                <button onclick="setWater('clear')">بركة صافية</button>
            </div>
        </div>

        <div class="category">
            <button class="category-toggle" onclick="toggleCat('cat-mtn')">⛰️ التضاريس</button>
            <div id="cat-mtn" class="category-content">
                <button onclick="updateTerrain('mtn')">جبال شاهقة</button>
                <button onclick="updateTerrain('flat')">أرض مسطحة</button>
            </div>
        </div>

        <button class="delete-btn" onclick="deleteObj()">حذف المختار</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, sunLight, ground;
    let objects = [];

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111115);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // إضاءة أساسية
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // إضافة الأرضية فوراً
        createGround();

        // أدوات التحكم
        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        window.addEventListener('mousedown', onSelect);
        animate();
    }

    function createGround() {
        if(ground) scene.remove(ground);
        const geo = new THREE.PlaneGeometry(100, 100, 20, 20);
        const mat = new THREE.MeshStandardMaterial({ color: 0x2d3a2d, roughness: 0.8 });
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    function toggleCat(id) {
        const el = document.getElementById(id);
        el.classList.toggle('active');
    }

    function toggleViewMode(isView) {
        document.getElementById('editor-ui').style.display = isView ? 'none' : 'block';
        document.getElementById('btn-edit').classList.toggle('active', !isView);
        document.getElementById('btn-view').classList.toggle('active', isView);
        if(isView) transform.detach();
    }

    function spawn(type, variant) {
        let mesh;
        if(type === 'tree') {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshStandardMaterial({color: 0x4d2600}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.2), new THREE.MeshStandardMaterial({color: variant === 'pine' ? 0x0a2a0a : 0x1a5a1a}));
            leaves.position.y = 1.8;
            group.add(trunk, leaves);
            mesh = group;
        }
        mesh.position.set(Math.random()*10-5, 0, Math.random()*10-5);
        mesh.traverse(child => { if(child.isMesh) child.castShadow = true; });
        scene.add(mesh);
        objects.push(mesh);
        transform.attach(mesh);
    }

    function updateTerrain(type) {
        if(type === 'mtn') {
            ground.geometry.attributes.position.array.forEach((v, i) => {
                if((i+1) % 3 === 0) ground.geometry.attributes.position.array[i] = Math.random() * 5;
            });
            ground.geometry.attributes.position.needsUpdate = true;
            ground.material.color.set(0x444444);
        } else {
            createGround();
        }
    }

    function setWater(type) {
        ground.material.color.set(type === 'ocean' ? 0x0044ff : 0x00ffff);
        ground.material.transparent = true;
        ground.material.opacity = 0.8;
    }

    function onSelect(e) {
        if(e.button !== 0 || !orbit.enabled) return;
        const mouse = new THREE.Vector2( (e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1 );
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            let obj = intersects[0].object;
            while(obj.parent !== scene) obj = obj.parent;
            transform.attach(obj);
        }
    }

    function deleteObj() { if(transform.object) { scene.remove(transform.object); transform.detach(); } }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
