<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | Nature Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(10, 10, 10, 0.9); --border: rgba(222, 255, 154, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        .corner-panel {
            position: absolute; background: var(--glass); padding: 12px; border-radius: 12px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
            display: flex; flex-direction: column; gap: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        
        .top-left { top: 20px; left: 20px; } 
        .top-right { top: 20px; right: 20px; }
        .bottom-left { bottom: 20px; left: 20px; width: 200px; }
        .bottom-right { bottom: 20px; right: 20px; }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px 12px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 13px; text-align: right;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        select.btn { width: 100%; background: #222; }
        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
        .label { font-size: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        
        #viewport { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div class="corner-panel top-left">
        <span class="label">التحكم</span>
        <button class="btn active" id="mode-t" onclick="setMode('translate')">تحريك (G)</button>
        <button class="btn" id="mode-r" onclick="setMode('rotate')">تدوير (R)</button>
        <button class="btn" id="mode-s" onclick="setMode('scale')">تحجيم (S)</button>
    </div>

    <div class="corner-panel top-right">
        <span class="label">إضافة شجر</span>
        <select id="tree-type" class="btn" onchange="spawnAtCenter('tree', this.value)">
            <option value="">+ اختر شجرة</option>
            <option value="oak">🌳 شجر بلوط</option>
            <option value="pine">🌲 صنوبر</option>
            <option value="palm">🌴 نخلة</option>
        </select>
        
        <span class="label">إضافة أرض</span>
        <select id="ground-type" class="btn" onchange="setGround(this.value)">
            <option value="flat">🟩 أرض مسطحة</option>
            <option value="sand">🏜️ صحراء رملية</option>
            <option value="mountains">⛰️ جبال وعرة</option>
        </select>

        <button class="btn" onclick="spawnAtCenter('grass')">🌱 إضافة أعشاب</button>
    </div>

    <div class="corner-panel bottom-left">
        <span class="label">قوة الشمس والظل</span>
        <input type="range" id="sun-val" min="0" max="2" step="0.1" value="1" oninput="updateSun()">
        
        <span class="label">قوة الرياح (Wind)</span>
        <input type="range" id="wind-val" min="0" max="0.1" step="0.01" value="0.02" oninput="updateWind()">
        
        <hr style="border:0; border-top:1px solid #333">
        <div id="obj-info" style="font-size:11px; color:#888;">لا يوجد عنصر مختار</div>
    </div>

    <div class="corner-panel bottom-right">
        <span class="label">نوع المجسم</span>
        <button class="btn" onclick="spawnAtCenter('cube')">📦 مكعب</button>
        <button class="btn" onclick="spawnAtCenter('sphere')">🔮 كرة</button>
        <hr style="border:0; border-top:1px solid #333">
        <button class="btn" onclick="deleteSelected()" style="color:#ff4444;">حذف المختار</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, raycaster, mouse;
    let ground, sunLight;
    let objects = [], windObjects = [];
    let selectedObj = null, windStrength = 0.02;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // الأساسيات: شبكة وضوء هادئ
        const grid = new THREE.GridHelper(40, 40, 0x222222, 0x111111);
        scene.add(grid);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // الشمس
        sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        window.addEventListener('mousedown', onSelect);

        // أرضية افتراضية
        setGround('flat');

        animate();
    }

    function setGround(type) {
        if(ground) scene.remove(ground);
        let geo = new THREE.PlaneGeometry(60, 60, 32, 32);
        let mat = new THREE.MeshStandardMaterial({color: 0x224422});

        if(type === 'sand') mat.color.set(0xd2b48c);
        if(type === 'mountains') {
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i), y = pos.getY(i);
                pos.setZ(i, Math.sin(x*0.2) * Math.cos(y*0.2) * 4);
            }
        }
        
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        if(type !== 'flat') scene.background = new THREE.Color(0x87ceeb);
    }

    function spawnAtCenter(type, subType) {
        let obj;
        if(type === 'tree') {
            obj = createTree(subType);
            windObjects.push(obj);
        } else if(type === 'grass') {
            obj = new THREE.Mesh(new THREE.ConeGeometry(0.1, 1, 4), new THREE.MeshStandardMaterial({color: 0x00ff00}));
            windObjects.push(obj);
        } else if(type === 'cube') {
            obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xdeff9a}));
        } else {
            obj = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), new THREE.MeshStandardMaterial({color: 0xdeff9a}));
        }
        
        obj.position.set(Math.random()*4-2, 1, Math.random()*4-2);
        obj.castShadow = true;
        scene.add(obj);
        objects.push(obj);
        select(obj);
    }

    function createTree(subType) {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 3), new THREE.MeshStandardMaterial({color: 0x4d2600}));
        trunk.position.y = 1.5;
        
        let leafGeo = new THREE.SphereGeometry(1.5, 8, 8);
        let leafCol = 0x116611;
        
        if(subType === 'pine') { leafGeo = new THREE.ConeGeometry(1.5, 4, 8); leafCol = 0x0a330a; }
        if(subType === 'palm') { leafGeo = new THREE.TorusGeometry(1, 0.2, 8, 20); leafCol = 0x228b22; }

        const leaves = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({color: leafCol}));
        leaves.position.y = subType === 'pine' ? 3.5 : 3;
        
        group.add(trunk, leaves);
        return group;
    }

    function onSelect(e) {
        if(e.target.tagName !== 'CANVAS') return;
        mouse.x = (e.clientX/window.innerWidth)*2-1;
        mouse.y = -(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            let t = intersects[0].object;
            while(t.parent && t.parent !== scene) t = t.parent;
            select(t);
        }
    }

    function select(obj) {
        selectedObj = obj;
        transform.attach(obj);
        document.getElementById('obj-info').innerText = "عنصر مختار: " + obj.type;
    }

    function setMode(mode) {
        transform.setMode(mode);
        document.querySelectorAll('.top-left .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('mode-'+mode[0]).classList.add('active');
    }

    function updateSun() { sunLight.intensity = document.getElementById('sun-val').value; }
    function updateWind() { windStrength = parseFloat(document.getElementById('wind-val').value); }

    function deleteSelected() {
        if(selectedObj) {
            scene.remove(selectedObj);
            objects = objects.filter(o => o !== selectedObj);
            windObjects = windObjects.filter(o => o !== selectedObj);
            transform.detach();
            selectedObj = null;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        let time = Date.now() * 0.002;
        
        // تحريك الرياح
        windObjects.forEach(obj => {
            obj.rotation.x = Math.sin(time) * windStrength;
            obj.rotation.z = Math.cos(time) * windStrength;
        });

        orbit.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
