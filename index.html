<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine Pro | Multi-Tool Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(15, 15, 15, 0.9); --border: rgba(222, 255, 154, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        .panel {
            position: absolute; background: var(--glass); padding: 12px; border-radius: 12px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .top-right { top: 20px; right: 20px; width: 160px; }
        .top-left { top: 20px; left: 20px; width: 160px; }
        .bottom-right { bottom: 20px; right: 20px; width: 200px; }
        .bottom-left { bottom: 20px; left: 20px; }

        .label { font-size: 11px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 4px; }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: right;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        .mode-selector {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border); z-index: 200;
        }

        #viewport { position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

    <div class="mode-selector">
        <button class="btn active" id="btn-edit" style="border-radius:20px; width:80px;" onclick="setView(false)">تعديل</button>
        <button class="btn" id="btn-view" style="border-radius:20px; width:80px;" onclick="setView(true)">رؤية</button>
    </div>

    <div class="panel top-right">
        <div class="label">➕ إضافة مجسمات</div>
        <button class="btn" onclick="spawn('tree')">🌳 إضافة شجرة</button>
        <button class="btn" onclick="spawn('grass')">🌱 إضافة أعشاب</button>
        <button class="btn" onclick="spawn('cube')">📦 إضافة مكعب</button>
    </div>

    <div class="panel top-left">
        <div class="label">🔧 أدوات التحكم</div>
        <button class="btn active" id="m-t" onclick="setTMode('translate')">التحريك (G)</button>
        <button class="btn" id="m-r" onclick="setTMode('rotate')">التدوير (R)</button>
        <button class="btn" id="m-s" onclick="setTMode('scale')">التكبير/التصغير (S)</button>
    </div>

    <div class="panel bottom-right">
        <div class="label">🌍 أنواع الأرض</div>
        <button class="btn" onclick="changeGround('green')">🟩 عشب</button>
        <button class="btn" onclick="changeGround('sand')">🟨 رمال</button>
        <button class="btn" onclick="changeGround('mtn')">⛰️ تضاريس</button>
        
        <div class="label">🍃 الرياح والإضاءة</div>
        <input type="range" min="0" max="0.1" step="0.01" value="0.03" oninput="windStrength = parseFloat(this.value)">
    </div>

    <div class="panel bottom-left">
        <button class="btn" style="color:#ff5555" onclick="deleteObj()">حذف المختار</button>
    </div>

    <div id="viewport"></div>

    <script src="script.js"></script>
</body>
</html>
