<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | Pro Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(20, 20, 20, 0.85); --border: rgba(222, 255, 154, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; }
        
        /* القوائم الموزعة في الزوايا */
        .panel {
            position: absolute; background: var(--glass); padding: 12px; border-radius: 10px;
            border: 1px solid var(--border); backdrop-filter: blur(8px); z-index: 100;
            display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .top-right { top: 20px; right: 20px; width: 180px; }
        .top-left { top: 20px; left: 20px; }
        .bottom-right { bottom: 20px; right: 20px; }
        .bottom-left { bottom: 20px; left: 20px; width: 200px; }

        .header { font-size: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 6px 10px;
            border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: right;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        .mode-selector {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border); z-index: 200;
        }

        #viewport { position: absolute; inset: 0; z-index: 1; }
        input[type="range"] { accent-color: var(--primary); width: 100%; }
    </style>
</head>
<body>

    <div class="mode-selector">
        <button class="btn active" id="btn-edit" style="border-radius:20px" onclick="setView(false)">تعديل</button>
        <button class="btn" id="btn-view" style="border-radius:20px" onclick="setView(true)">رؤية</button>
    </div>

    <div class="panel top-right" id="ui-assets">
        <div class="header">إضافة عناصر</div>
        <button class="btn" onclick="spawn('tree', 'oak')">🌳 شجرة بلوط</button>
        <button class="btn" onclick="spawn('tree', 'pine')">🌲 صنوبر</button>
        <button class="btn" onclick="spawn('grass')">🌱 أعشاب</button>
        <button class="btn" onclick="spawn('cube')">📦 مكعب</button>
    </div>

    <div class="panel top-left" id="ui-tools">
        <div class="header">الأدوات</div>
        <button class="btn active" id="m-t" onclick="setTMode('translate')">تحريك (G)</button>
        <button class="btn" id="m-r" onclick="setTMode('rotate')">تدوير (R)</button>
        <button class="btn" id="m-s" onclick="setTMode('scale')">تحجيم (S)</button>
    </div>

    <div class="panel bottom-left" id="ui-env">
        <div class="header">البيئة</div>
        <button class="btn" onclick="setGround('mtn')">⛰️ جبال</button>
        <button class="btn" onclick="setGround('flat')">🟩 أرض مسطحة</button>
        <div class="header">الإضاءة</div>
        <input type="range" min="0" max="2" step="0.1" value="1" oninput="sunLight.intensity = this.value">
    </div>

    <div class="panel bottom-right" id="ui-selection">
        <div class="header">العنصر المختار</div>
        <div id="obj-name" style="font-size:11px; color:#888">لا يوجد</div>
        <button class="btn" style="color:#ff5555" onclick="deleteObj()">حذف (Del)</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, sunLight, ground;
    let objects = [];

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(25, 25, 25);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // الشبكة والأرضية
        const grid = new THREE.GridHelper(50, 50, 0x333333, 0x222222);
        scene.add(grid);
        setGround('flat');

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        window.addEventListener('mousedown', onSelect);
        window.addEventListener('keydown', (e) => {
            if(e.key === 'g') setTMode('translate');
            if(e.key === 'r') setTMode('rotate');
            if(e.key === 's') setTMode('scale');
            if(e.key === 'Delete') deleteObj();
        });

        animate();
    }

    function setGround(type) {
        if(ground) scene.remove(ground);
        const geo = new THREE.PlaneGeometry(100, 100, 40, 40);
        const mat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        if(type === 'mtn') {
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                pos.setZ(i, Math.random() * 3);
            }
            mat.color.set(0x333333);
        }
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    function spawn(type, variant) {
        let obj;
        if(type === 'tree') {
            const g = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 3), new THREE.MeshStandardMaterial({color: 0x4d2600}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({color: variant === 'pine' ? 0x0a330a : 0x228b22}));
            leaves.position.y = 2.5;
            g.add(trunk, leaves);
            obj = g;
        } else if(type === 'grass') {
            obj = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1, 3), new THREE.MeshStandardMaterial({color: 0x44ff44}));
        } else {
            obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: var(--primary)}));
        }
        
        obj.position.set(Math.random()*10-5, 0, Math.random()*10-5);
        obj.traverse(c => { if(c.isMesh) c.castShadow = true; });
        scene.add(obj);
        objects.push(obj);
        select(obj);
    }

    function onSelect(e) {
        if(e.target.tagName !== 'CANVAS') return;
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            let t = intersects[0].object;
            while(t.parent && t.parent !== scene) t = t.parent;
            select(t);
        }
    }

    function select(obj) {
        transform.attach(obj);
        document.getElementById('obj-name').innerText = "عنصر: " + obj.type;
    }

    function setTMode(m) {
        transform.setMode(m);
        document.querySelectorAll('.top-left .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m[0]).classList.add('active');
    }

    function deleteObj() {
        if(transform.object) {
            const o = transform.object;
            scene.remove(o);
            objects = objects.filter(item => item !== o);
            transform.detach();
            document.getElementById('obj-name').innerText = "لا يوجد";
        }
    }

    function setView(isView) {
        const ui = ['ui-assets', 'ui-tools', 'ui-env', 'ui-selection'];
        ui.forEach(id => document.getElementById(id).style.display = isView ? 'none' : 'flex');
        document.getElementById('btn-edit').classList.toggle('active', !isView);
        document.getElementById('btn-view').classList.toggle('active', isView);
        if(isView) transform.detach();
    }

    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
