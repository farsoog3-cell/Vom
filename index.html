<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neo-Engine | المحرك الاحترافي</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        :root {
            --blender-bg: #393939;
            --sidebar-color: #282828;
            --accent: #deff9a;
            --header-color: #181818;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #111; color: white; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            overflow: hidden;
        }

        /* شاشة الترحيب وإدارة المشروع */
        #project-gateway {
            position: fixed; inset: 0; background: #0b0b0b;
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .gateway-card {
            background: var(--sidebar-color); padding: 40px; border-radius: 20px;
            border: 2px solid var(--accent); text-align: center;
            box-shadow: 0 0 40px rgba(222, 255, 154, 0.1);
        }
        input { 
            background: #1a1a1a; border: 1px solid #444; color: white;
            padding: 15px; width: 280px; border-radius: 8px; margin: 20px 0;
            text-align: center; font-size: 16px; outline: none;
        }

        /* واجهة المحرك (Layout) */
        .engine-ui {
            display: grid;
            grid-template-columns: 240px 1fr 280px;
            grid-template-rows: 50px 1fr 30px;
            height: 100vh;
            visibility: hidden; /* تظهر بعد تسمية المشروع */
        }

        header { 
            grid-area: 1 / 1 / 2 / 4; background: var(--header-color); 
            display: flex; align-items: center; padding: 0 20px; 
            border-bottom: 1px solid #000; gap: 20px;
        }

        .viewport { 
            grid-area: 2 / 2 / 3 / 3; background: var(--blender-bg); 
            position: relative; cursor: crosshair;
        }

        .side-panel { background: var(--sidebar-color); padding: 15px; border: 1px solid #1a1a1a; }
        .hierarchy { grid-area: 2 / 1 / 3 / 2; }
        .inspector { grid-area: 2 / 3 / 3 / 4; }

        footer { 
            grid-area: 3 / 1 / 4 / 4; background: #1a1a1a; 
            font-size: 11px; display: flex; align-items: center; 
            padding: 0 15px; color: #666;
        }

        .btn { 
            background: var(--accent); color: black; border: none; 
            padding: 8px 18px; border-radius: 5px; cursor: pointer; 
            font-weight: bold; font-size: 13px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="project-gateway">
        <div class="gateway-card">
            <h1 style="color: var(--accent); margin: 0;">NEO-ENGINE</h1>
            <p style="color: #888;">أدخل اسم لعبتك للبدء في التصنيع</p>
            <input type="text" id="project-input" placeholder="مثلاً: عالم المغامرات">
            <br>
            <button class="btn" style="padding: 15px 40px;" onclick="runEngine()">بدء المحرك</button>
        </div>
    </div>

    <div class="engine-ui" id="main-ui">
        <header>
            <div style="font-weight: bold; color: var(--accent); font-size: 18px;">NEO</div>
            <div id="current-name" style="font-size: 14px;"></div>
            <div style="flex-grow: 1;"></div>
            <button class="btn" onclick="saveData()">حفظ (Save)</button>
        </header>

        <aside class="side-panel hierarchy">
            <h4 style="color: #888; margin-bottom: 15px;">Elements (العناصر)</h4>
            <div id="obj-list" style="color: var(--accent);">• Cube (المكعب الأساسي)</div>
        </aside>

        <main class="viewport" id="render-zone"></main>

        <aside class="side-panel inspector">
            <h4 style="color: #888; margin-bottom: 15px;">Properties (الخصائص)</h4>
            <div style="font-size: 12px;">
                موقع X: <input type="number" id="posX" value="0" step="0.1" oninput="applyX()" style="width: 50px;">
                <br><br>
                <button class="btn" style="background: #ff5555; color: white; width: 100%;" onclick="removeCube()">حذف المكعب</button>
            </div>
        </aside>

        <footer>
            <span>Status: Engine Running</span>
            <span style="margin-right: 20px;">Platform: WebGL 2.0</span>
        </footer>
    </div>

    <script>
        let scene, camera, renderer, cube, controls;

        function runEngine() {
            const name = document.getElementById('project-input').value || "New Project";
            document.getElementById('current-name').innerText = "المشروع الحالي: " + name;
            
            document.getElementById('project-gateway').classList.add('hidden');
            document.getElementById('main-ui').style.visibility = 'visible';

            setupCore();
        }

        function setupCore() {
            const viewport = document.getElementById('render-zone');

            // 1. المشهد
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x393939);

            // 2. الكاميرا
            camera = new THREE.PerspectiveCamera(75, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(4, 4, 4);

            // 3. المحرك
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            viewport.appendChild(renderer.domElement);

            // 4. التحكم (مثل بلندر)
            controls = new THREE.OrbitControls(camera, renderer.domElement);

            // 5. الشبكة (Grid) والمحاور
            scene.add(new THREE.GridHelper(20, 20, 0x222222, 0x444444));
            scene.add(new THREE.AxesHelper(2));

            // 6. المكعب
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({ color: 0xdeff9a });
            cube = new THREE.Mesh(geometry, material);
            cube.position.y = 0.5;
            scene.add(cube);

            // 7. الإضاءة
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(5, 5, 5);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0x404040, 2));

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function applyX() {
            if(cube) cube.position.x = parseFloat(document.getElementById('posX').value);
        }

        function removeCube() {
            scene.remove(cube);
            document.getElementById('obj-list').innerHTML = "<span style='color:red;'>Scene Empty</span>";
        }

        function saveData() {
            alert("تم الحفظ في ذاكرة المحرك!");
        }

        window.addEventListener('resize', () => {
            const v = document.getElementById('render-zone');
            camera.aspect = v.clientWidth / v.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(v.clientWidth, v.clientHeight);
        });
    </script>
</body>
</html>
