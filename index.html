<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine Pro | الواجهة الاحترافية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; color: #eee; font-family: 'Segoe UI', sans-serif; }
        
        /* شاشة البداية الأنيقة */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .start-btn {
            background: none; border: 1px solid #deff9a; color: #deff9a;
            padding: 15px 40px; cursor: pointer; font-size: 18px; letter-spacing: 2px;
            transition: 0.3s;
        }
        .start-btn:hover { background: #deff9a; color: #000; }

        /* واجهة المستخدم المخفية جزئياً */
        .viewport-container { position: relative; width: 100%; height: 100vh; background: #333; }
        
        /* شريط الأدوات العلوي العائم */
        .toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.85); padding: 5px 15px;
            border-radius: 30px; display: flex; gap: 15px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); z-index: 10;
        }
        .tool-icon { background: none; border: none; color: #888; cursor: pointer; padding: 8px; font-size: 14px; }
        .tool-icon.active { color: #deff9a; font-weight: bold; }

        /* لوحة البيانات الجانبية (شفافة) */
        .stats {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px;
            font-family: monospace; font-size: 12px; pointer-events: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="splash">
    <h1 style="letter-spacing: 5px; font-weight: 100; margin-bottom: 30px;">NEO ENGINE</h1>
    <button class="start-btn" onclick="launch()">INITIALIZE</button>
</div>

<div id="editor" class="hidden">
    <div class="toolbar">
        <button class="tool-icon active" id="btn-w" onclick="setMode('translate')">MOVE (W)</button>
        <button class="tool-icon" id="btn-e" onclick="setMode('rotate')">ROTATE (E)</button>
        <button class="tool-icon" id="btn-r" onclick="setMode('scale')">SCALE (R)</button>
        <div style="width: 1px; background: #444; margin: 5px 0;"></div>
        <button class="tool-icon" onclick="addCube()">+ CUBE</button>
    </div>

    <div class="stats" id="ui-stats">
        POSITION X: 0.00 | Y: 0.50 | Z: 0.00
    </div>

    <div id="container" class="viewport-container"></div>
</div>

<script>
    let scene, camera, renderer, cube, controls, transformControls;

    function launch() {
        document.getElementById('splash').classList.add('hidden');
        document.getElementById('editor').classList.remove('hidden');
        init();
    }

    function init() {
        const container = document.getElementById('container');

        // المشهد
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        // الكاميرا
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 6);

        // المحرك
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // الإضاءة (Realistic)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // الشبكة (Grid)
        const grid = new THREE.GridHelper(20, 40, 0x333333, 0x2a2a2a);
        scene.add(grid);

        // إضافة المكعب
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshPhongMaterial({ color: 0xdeff9a });
        cube = new THREE.Mesh(geometry, material);
        cube.position.y = 0.5;
        scene.add(cube);

        // تحكم الكاميرا
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // نظام التحريك XYZ (Gizmo)
        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.attach(cube);
        scene.add(transformControls);

        transformControls.addEventListener('dragging-changed', (e) => {
            controls.enabled = !e.value;
        });

        transformControls.addEventListener('change', updateUI);

        // اختصارات الكيبورد
        window.addEventListener('keydown', (e) => {
            if(e.key === 'w') setMode('translate');
            if(e.key === 'e') setMode('rotate');
            if(e.key === 'r') setMode('scale');
        });

        animate();
    }

    function setMode(mode) {
        transformControls.setMode(mode);
        document.querySelectorAll('.tool-icon').forEach(btn => btn.classList.remove('active'));
        if(mode === 'translate') document.getElementById('btn-w').classList.add('active');
        if(mode === 'rotate') document.getElementById('btn-e').classList.add('active');
        if(mode === 'scale') document.getElementById('btn-r').classList.add('active');
    }

    function addCube() {
        const mesh = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff })
        );
        mesh.position.y = 0.5;
        scene.add(mesh);
        transformControls.attach(mesh);
    }

    function updateUI() {
        const p = transformControls.object.position;
        document.getElementById('ui-stats').innerText = 
            `POSITION X: ${p.x.toFixed(2)} | Y: ${p.y.toFixed(2)} | Z: ${p.z.toFixed(2)}`;
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
