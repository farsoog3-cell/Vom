<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | Wind & Logic Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(15, 15, 15, 0.9); --border: rgba(222, 255, 154, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        .panel {
            position: absolute; background: var(--glass); padding: 12px; border-radius: 12px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .top-right { top: 20px; right: 20px; width: 160px; }
        .top-left { top: 20px; left: 20px; }
        .bottom-left { bottom: 20px; left: 20px; width: 180px; }
        .bottom-right { bottom: 20px; right: 20px; }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: right;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        .mode-selector {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border); z-index: 200;
        }

        #viewport { position: absolute; inset: 0; z-index: 1; }
        .label { font-size: 10px; color: var(--primary); text-transform: uppercase; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="mode-selector">
        <button class="btn active" id="btn-edit" style="border-radius:20px; width:80px;" onclick="setView(false)">تعديل</button>
        <button class="btn" id="btn-view" style="border-radius:20px; width:80px;" onclick="setView(true)">رؤية</button>
    </div>

    <div class="panel top-right">
        <div class="label">إضافة عناصر</div>
        <button class="btn" onclick="spawn('tree')">🌳 إضافة شجرة</button>
        <button class="btn" onclick="spawn('grass')">🌱 إضافة أعشاب</button>
        <button class="btn" onclick="spawn('cube')">📦 مكعب</button>
    </div>

    <div class="panel top-left">
        <div class="label">الأدوات</div>
        <button class="btn active" id="m-t" onclick="setTMode('translate')">تحريك (G)</button>
        <button class="btn" id="m-r" onclick="setTMode('rotate')">تدوير (R)</button>
        <button class="btn" id="m-s" onclick="setTMode('scale')">تحجيم (S)</button>
    </div>

    <div class="panel bottom-left">
        <div class="label">البيئة والرياح</div>
        <button class="btn" onclick="setGroundType('mtn')">⛰️ تضاريس وعرة</button>
        <button class="btn" onclick="setGroundType('flat')">🟩 أرض خضراء</button>
        <div class="label">قوة الرياح</div>
        <input type="range" min="0" max="0.1" step="0.01" value="0.03" oninput="windStrength = parseFloat(this.value)">
    </div>

    <div class="panel bottom-right">
        <button class="btn" style="color:#ff5555" onclick="deleteObj()">حذف المختار</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, sunLight, ground;
    let objects = [], windObjects = [];
    let windStrength = 0.03;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0c);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // إضاءة قوية
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(30, 50, 10);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // إنشاء الأرضية
        setGroundType('flat');

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // نظام الاختيار المحسن
        window.addEventListener('mousedown', onSelect);
        
        animate();
    }

    function setGroundType(type) {
        if(ground) scene.remove(ground);
        const geo = new THREE.PlaneGeometry(100, 100, 32, 32);
        const mat = new THREE.MeshStandardMaterial({ color: 0x1d2b1d, side: THREE.DoubleSide });
        
        if(type === 'mtn') {
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let z = Math.sin(pos.getX(i)*0.2) * Math.cos(pos.getY(i)*0.2) * 3;
                pos.setZ(i, z);
            }
            mat.color.set(0x333333);
        }
        
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // شبكة مساعدة
        const grid = new THREE.GridHelper(100, 40, 0x444444, 0x222222);
        grid.position.y = 0.05;
        scene.add(grid);
    }

    function spawn(type) {
        let obj;
        if(type === 'tree') {
            obj = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3), new THREE.MeshStandardMaterial({color: 0x4d2600}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), new THREE.MeshStandardMaterial({color: 0x1a5a1a}));
            leaves.position.y = 2.5;
            obj.add(trunk, leaves);
            windObjects.push(obj); // إضافة للرياح
        } else if(type === 'grass') {
            obj = new THREE.Mesh(new THREE.ConeGeometry(0.1, 1, 3), new THREE.MeshStandardMaterial({color: 0x44ff44}));
            windObjects.push(obj); // إضافة للرياح
        } else {
            obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xdeff9a}));
        }

        obj.position.set(Math.random()*10-5, 0, Math.random()*10-5);
        obj.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        scene.add(obj);
        objects.push(obj);
        transform.attach(obj);
    }

    function onSelect(e) {
        if(e.target.tagName !== 'CANVAS') return;
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            let target = intersects[0].object;
            // التأكد من اختيار المجموعة الكاملة (مثل الشجرة) وليس فقط الجذع
            while(target.parent && target.parent !== scene) target = target.parent;
            transform.attach(target);
        }
    }

    function setTMode(m) {
        transform.setMode(m);
        document.querySelectorAll('.top-left .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m[0]).classList.add('active');
    }

    function deleteObj() {
        if(transform.object) {
            const target = transform.object;
            scene.remove(target);
            objects = objects.filter(o => o !== target);
            windObjects = windObjects.filter(o => o !== target);
            transform.detach();
        }
    }

    function setView(isView) {
        document.querySelectorAll('.panel').forEach(p => p.style.display = isView ? 'none' : 'flex');
        document.getElementById('btn-edit').classList.toggle('active', !isView);
        document.getElementById('btn-view').classList.toggle('active', isView);
        if(isView) transform.detach();
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // محاكاة الرياح
        const time = Date.now() * 0.002;
        windObjects.forEach(obj => {
            obj.rotation.z = Math.sin(time) * windStrength;
            obj.rotation.x = Math.cos(time * 0.5) * windStrength;
        });

        orbit.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
