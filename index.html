<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Engine - War Zone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
            user-select: none;
            background: #050508;
        }

        /* واجهة القائمة الرئيسية القتالية */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* خلفية توحي بوجود دخان وضباب حرب */
            background: radial-gradient(circle, rgba(26,36,26,0.4) 0%, rgba(10,12,18,1) 100%), 
                        url('https://www.transparenttextures.com/patterns/dark-matter.png');
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            color: #fff;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* عنوان اللعبة الحربي */
        h1 {
            font-size: 4.5rem;
            margin-bottom: 5px;
            letter-spacing: 5px;
            color: #ff3838;
            text-shadow: 0 0 15px rgba(255, 56, 56, 0.7), 3px 3px 0px #440000;
            text-transform: uppercase;
            animation: pulse 2s infinite alternate;
        }

        .subtitle {
            font-family: 'Courier New', Courier, monospace;
            color: #78e08f;
            font-size: 1.1rem;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(120, 224, 143, 0.5);
        }

        /* لوحة التحكم العسكرية */
        .menu-card {
            background: rgba(15, 20, 25, 0.85);
            padding: 40px;
            border-radius: 4px; /* زوايا حادة لتبدو عسكرية */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 56, 56, 0.2);
            border: 2px solid #ff3838;
            text-align: center;
            min-width: 360px;
            position: relative;
            clip-path: polygon(0 0, 93% 0, 100% 7%, 100% 100%, 7% 100%, 0 93%); /* حواف مشطوفة عسكرية */
        }

        /* إضافة زوايا رادار رقمية جمالية */
        .menu-card::before {
            content: "SECURE CONNECTION";
            position: absolute;
            top: 5px;
            left: 15px;
            font-family: monospace;
            font-size: 0.6rem;
            color: #78e08f;
            opacity: 0.7;
        }

        .control-group {
            margin-bottom: 25px;
            font-family: 'Courier New', Courier, monospace;
        }

        label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: #bdc581; /* لون زيتي عسكري */
            font-weight: bold;
            text-transform: uppercase;
        }

        /* صندوق إدخال الأرقام القتالي */
        .enemy-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        input[type="number"] {
            width: 90px;
            padding: 10px;
            border: 1px solid #78e08f;
            text-align: center;
            font-size: 1.4rem;
            font-family: 'Impact', sans-serif;
            background: #1e272e;
            color: #78e08f;
            text-shadow: 0 0 5px rgba(120, 224, 143, 0.8);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
        }

        /* زر البدء الحربي الكبير */
        .btn-start {
            background: linear-gradient(180deg, #ff3838 0%, #c0392b 100%);
            color: white;
            border: 1px solid #ff7675;
            padding: 15px 50px;
            font-size: 1.6rem;
            font-family: 'Impact', sans-serif;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 56, 56, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-start:hover {
            background: linear-gradient(180deg, #ff5252 0%, #e74c3c 100%);
            box-shadow: 0 0 25px rgba(255, 56, 56, 0.8);
            transform: scale(1.02);
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* مؤشرات اللعبة أثناء القتال (HUD) */
        #game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: monospace;
            color: #78e08f;
            z-index: 5;
            display: none;
            pointer-events: none;
            background: rgba(10, 15, 10, 0.85);
            padding: 15px 25px;
            border-left: 4px solid #78e08f;
            border-top: 1px solid rgba(120, 224, 143, 0.3);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .hud-title {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        #ui-enemies {
            font-size: 2rem;
            font-family: 'Impact', sans-serif;
            color: #ff3838;
            text-shadow: 0 0 10px rgba(255,56,56,0.5);
        }

        /* علامة التصويب المتقدمة */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
            pointer-events: none;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #ff3838;
        }
        /* الخط الأفقي والعمودي للـ Crosshair */
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { left: 11px; top: 0; width: 2px; height: 24px; }

        /* حركات تأثير الوميض */
        @keyframes pulse {
            0% { text-shadow: 0 0 10px rgba(255, 56, 56, 0.6); }
            100% { text-shadow: 0 0 25px rgba(255, 56, 56, 0.9), 0 0 10px rgba(255,56,56,0.4); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <!-- القائمة الرئيسية الحربية -->
    <div id="main-menu">
        <h1>BATTLE ZONE</h1>
        <div class="subtitle">KHALID ENGINE v2.0 // COMBAT INITIALIZATION</div>
        
        <div class="menu-card">
            <div class="control-group">
                <label>OPERATIONAL MODE</label>
                <div style="color: #78e08f; font-size: 1.2rem; letter-spacing: 1px;">[ SINGLEPLAYER / فردي ]</div>
            </div>
            
            <div class="control-group">
                <label for="enemy-count">TARGET HOSTILES (عدد الأعداء)</label>
                <div class="enemy-selector">
                    <input type="number" id="enemy-count" min="1" max="25" value="6">
                </div>
            </div>
            
            <button class="btn-start" onclick="startGame()">ENGAGE (بدء المعركة)</button>
        </div>
    </div>

    <!-- لوحة قيادة الحرب أثناء اللعب (HUD) -->
    <div id="game-ui">
        <div class="hud-title">TACTICAL RADAR</div>
        <div>HOSTILES REMAINING: <span id="ui-enemies">0</span></div>
        <div style="margin-top: 10px; font-size: 0.75rem; color: #a4b0be; letter-spacing: 1px;">
            L-CLICK: FIRE CANNON | WASD: MOVE
        </div>
    </div>
    
    <!-- علامة القنص الحمراء -->
    <div id="crosshair"></div>

    <script>
        // المحرك والفيزياء
        let scene, camera, renderer, world;
        let gameRunning = false;
        let balls = [], ballBodies = [];
        let destructibleBuildings = [], buildingBodies = [];
        let enemies = [], enemyBodies = [];
        
        // التحرك
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let playerVelocity = new THREE.Vector3();

        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a202c); // سماء ليلية معتمة تناسب الحرب
            scene.fog = new THREE.Fog(0x1a202c, 15, 45);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // إضاءة حرب (قوية وموجهة)
            const hemiLight = new THREE.HemisphereLight(0x556677, 0x111122, 0.6);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // إعداد الفيزياء
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);

            // أرضية الميدان
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0 });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);

            const floorMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ color: 0x1e272e, roughness: 0.9 })
            );
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            window.addEventListener('resize', onWindowResize);
            setupControls();
        }

        function createDestructibleBuilding(x, z) {
            const blockSize = { width: 1.6, height: 1.1, depth: 1.6 };
            const rows = 6; 
            const cols = 3; 

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const blockShape = new CANNON.Box(new CANNON.Vec3(blockSize.width/2, blockSize.height/2, blockSize.depth/2));
                    const blockBody = new CANNON.Body({ mass: 8 }); 
                    blockBody.addShape(blockShape);
                    
                    const posX = x + (j * (blockSize.width + 0.05)) - (cols * blockSize.width)/2;
                    const posY = (i * (blockSize.height + 0.05)) + blockSize.height/2;
                    const posZ = z;
                    
                    blockBody.position.set(posX, posY, posZ);
                    world.addBody(blockBody);
                    buildingBodies.push(blockBody);

                    const blockMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(blockSize.width, blockSize.height, blockSize.depth),
                        new THREE.MeshStandardMaterial({ color: 0x485460, roughness: 0.7 }) // لون خرساني غامق
                    );
                    blockMesh.castShadow = true;
                    blockMesh.receiveShadow = true;
                    scene.add(blockMesh);
                    destructibleBuildings.push(blockMesh);
                }
            }
        }

        function spawnEnemies(count) {
            for (let i = 0; i < count; i++) {
                const radius = 1;
                const enemyShape = new CANNON.Sphere(radius);
                const enemyBody = new CANNON.Body({ mass: 20 });
                enemyBody.addShape(enemyShape);
                
                const posX = (Math.random() - 0.5) * 25;
                const posZ = -12 - (Math.random() * 15);
                enemyBody.position.set(posX, radius, posZ);
                world.addBody(enemyBody);
                enemyBodies.push(enemyBody);

                const enemyMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(radius, 32, 32),
                    new THREE.MeshStandardMaterial({ color: 0xff3838, roughness: 0.3, metalness: 0.8 })
                );
                enemyMesh.castShadow = true;
                scene.add(enemyMesh);
                enemies.push(enemyMesh);
            }
            document.getElementById('ui-enemies').innerText = count;
        }

        function shootProjectile() {
            if (!gameRunning) return;

            const radius = 0.35;
            const ballShape = new CANNON.Sphere(radius);
            const ballBody = new CANNON.Body({ mass: 60 }); 
            ballBody.addShape(ballShape);

            const launchPos = new THREE.Vector3();
            camera.getWorldPosition(launchPos);
            ballBody.position.set(launchPos.x, launchPos.y, launchPos.z);
            
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            const shootForce = 75; // قذيفة أسرع وأقوى للتدمير الحربي
            ballBody.velocity.set(direction.x * shootForce, direction.y * shootForce, direction.z * shootForce);
            
            world.addBody(ballBody);
            ballBodies.push(ballBody);

            const ballMesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff3838 }) // قذائف حارقة حمراء
            );
            scene.add(ballMesh);
            balls.push(ballMesh);
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if(!gameRunning) return;
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            window.addEventListener('click', () => {
                if (gameRunning) shootProjectile();
            });

            window.addEventListener('mousemove', (e) => {
                if (!gameRunning) return;
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, camera.rotation.x));
            });
        }

        function startGame() {
            const enemyCount = parseInt(document.getElementById('enemy-count').value) || 6;
            
            document.getElementById('main-menu').style.transform = 'scale(1.2)';
            document.getElementById('main-menu').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('main-menu').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
            }, 500);

            document.body.requestPointerLock();

            initEngine();

            // توزيع المباني في الساحة عشوائياً كخطوط دفاعية
            createDestructibleBuilding(-6, -8);
            createDestructibleBuilding(6, -8);
            createDestructibleBuilding(0, -16);

            spawnEnemies(enemyCount);

            gameRunning = true;
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            world.step(1 / 60);

            // المقذوفات
            for (let i = 0; i < balls.length; i++) {
                balls[i].position.copy(ballBodies[i].position);
            }

            // تدمير المباني وهدم الكتل
            for (let i = 0; i < destructibleBuildings.length; i++) {
                destructibleBuildings[i].position.copy(buildingBodies[i].position);
                destructibleBuildings[i].quaternion.copy(buildingBodies[i].quaternion);
            }

            // حركة الأعداء والقتال
            let aliveEnemies = 0;
            for (let i = 0; i < enemies.length; i++) {
                enemies[i].position.copy(enemyBodies[i].position);
                enemies[i].quaternion.copy(enemyBodies[i].quaternion);

                // هجوم الأعداء نحو اللاعب
                if (enemyBodies[i].position.z < camera.position.z) {
                    enemyBodies[i].position.z += 0.03;
                }

                if(enemyBodies[i].position.y > -3) {
                    aliveEnemies++;
                }
            }
            document.getElementById('ui-enemies').innerText = aliveEnemies;

            // تحريك اللاعب
            playerVelocity.set(0, 0, 0);
            if (moveForward) playerVelocity.z -= 0.12;
            if (moveBackward) playerVelocity.z += 0.12;
            if (moveLeft) playerVelocity.x -= 0.12;
            if (moveRight) playerVelocity.x += 0.12;

            camera.translateOnAxis(playerVelocity, 1);
            camera.position.y = 2; 

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
