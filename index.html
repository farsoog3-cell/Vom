<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | Fix Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(15, 15, 15, 0.9); --border: rgba(222, 255, 154, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        .panel {
            position: absolute; background: var(--glass); padding: 12px; border-radius: 12px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
            display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .top-right { top: 20px; right: 20px; width: 160px; }
        .top-left { top: 20px; left: 20px; }
        .bottom-right { bottom: 20px; right: 20px; }
        .bottom-left { bottom: 20px; left: 20px; width: 180px; }

        .header { font-size: 11px; color: var(--primary); text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: right;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        .mode-selector {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border); z-index: 200;
        }

        #viewport { position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

    <div class="mode-selector">
        <button class="btn active" id="btn-edit" style="border-radius:20px; width:80px;" onclick="setView(false)">تعديل</button>
        <button class="btn" id="btn-view" style="border-radius:20px; width:80px;" onclick="setView(true)">رؤية</button>
    </div>

    <div class="panel top-right" id="ui-assets">
        <div class="header">إضافة</div>
        <button class="btn" onclick="spawn('tree', 'oak')">🌳 شجرة</button>
        <button class="btn" onclick="spawn('grass')">🌱 أعشاب</button>
        <button class="btn" onclick="spawn('cube')">📦 مكعب</button>
    </div>

    <div class="panel top-left" id="ui-tools">
        <div class="header">الأدوات</div>
        <button class="btn active" id="m-t" onclick="setTMode('translate')">تحريك (G)</button>
        <button class="btn" id="m-r" onclick="setTMode('rotate')">تدوير (R)</button>
        <button class="btn" id="m-s" onclick="setTMode('scale')">تحجيم (S)</button>
    </div>

    <div class="panel bottom-left" id="ui-env">
        <div class="header">البيئة</div>
        <button class="btn" onclick="setGround('mtn')">⛰️ تضاريس</button>
        <button class="btn" onclick="setGround('flat')">🟩 مسطحة</button>
        <hr style="border:0; border-top:1px solid #333">
        <input type="range" min="0" max="2" step="0.1" value="1.2" oninput="sunLight.intensity = this.value">
    </div>

    <div class="panel bottom-right" id="ui-selection">
        <div class="header">التحكم</div>
        <button class="btn" style="color:#ff5555" onclick="deleteObj()">حذف المختار</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, sunLight, ground;
    let objects = [];

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101015);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // إضاءة قوية وشاملة
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(30, 50, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // إنشاء الأرضية فوراً
        createDefaultGround();

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        window.addEventListener('mousedown', onSelect);
        animate();
    }

    function createDefaultGround() {
        if(ground) scene.remove(ground);
        const geo = new THREE.PlaneGeometry(100, 100, 1, 1);
        const mat = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide });
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // إضافة شبكة توضيحية
        const grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        grid.position.y = 0.01;
        scene.add(grid);
    }

    function spawn(type, variant) {
        let obj;
        const mat = new THREE.MeshStandardMaterial({color: 0xdeff9a});
        
        if(type === 'tree') {
            obj = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), new THREE.MeshStandardMaterial({color: 0x4d2600}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.2), new THREE.MeshStandardMaterial({color: 0x1a5a1a}));
            leaves.position.y = 1.5;
            obj.add(trunk, leaves);
        } else if(type === 'grass') {
            obj = new THREE.Mesh(new THREE.ConeGeometry(0.2, 1, 3), new THREE.MeshStandardMaterial({color: 0x44ff44}));
        } else {
            obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), mat);
        }
        
        obj.position.set(0, 1, 0); // نضعها في المنتصف لتبدأ منها
        obj.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        scene.add(obj);
        objects.push(obj);
        transform.attach(obj);
    }

    function setGround(type) {
        if(type === 'mtn') {
            ground.material.color.set(0x333333);
            // محاكاة بسيطة للتضاريس
            ground.scale.set(1, 1, 1.5); 
        } else {
            ground.scale.set(1, 1, 1);
            ground.material.color.set(0x222222);
        }
    }

    function onSelect(e) {
        if(e.target.tagName !== 'CANVAS') return;
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            let t = intersects[0].object;
            while(t.parent && t.parent !== scene) t = t.parent;
            transform.attach(t);
        }
    }

    function setTMode(m) {
        transform.setMode(m);
        document.querySelectorAll('.top-left .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m[0]).classList.add('active');
    }

    function deleteObj() {
        if(transform.object) {
            const target = transform.object;
            scene.remove(target);
            objects = objects.filter(o => o !== target);
            transform.detach();
        }
    }

    function setView(isView) {
        const panels = document.querySelectorAll('.panel');
        panels.forEach(p => p.style.display = isView ? 'none' : 'flex');
        document.getElementById('btn-edit').classList.toggle('active', !isView);
        document.getElementById('btn-view').classList.toggle('active', isView);
        if(isView) transform.detach();
    }

    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
