<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك ألعاب ثلاثي الأبعاد</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">
    <h3>لوحة التحكم</h3>
    <p>استخدم الماوس للتدوير</p>
    <p>البكرة للتقريب والابتعاد</p>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. إعداد المشهد (Scene)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // لون السماء

    // 2. الكاميرا (Camera)
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 10, 15);

    // 3. المحرك (Renderer)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; // تفعيل الظلال
    document.body.appendChild(renderer.domElement);

    // 4. التحكم (Controls)
    const controls = new OrbitControls(camera, renderer.domElement);

    // 5. الشبكة والأرضية (Grid & Floor)
    const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x888888);
    scene.add(gridHelper);

    const planeGeo = new THREE.PlaneGeometry(50, 50);
    const planeMat = new THREE.MeshPhongMaterial({ color: 0x348C31 }); // لون عشبي
    const ground = new THREE.Mesh(planeGeo, planeMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 6. الإضاءة (الشمس)
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    scene.add(sunLight);
    
    const ambientLight = new THREE.AmbientLight(0x404040, 1); // إضاءة محيطية خفيفة
    scene.add(ambientLight);

    // 7. المكعب الأساسي
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const boxMat = new THREE.MeshPhongMaterial({ color: 0xff0000 });
    const cube = new THREE.Mesh(boxGeo, boxMat);
    cube.position.y = 0.5;
    cube.castShadow = true;
    scene.add(cube);

    // 8. وظيفة إنشاء أشجار متنوعة
    function createTree(x, z, type) {
        const treeGroup = new THREE.Group();

        // الجذع
        const trunkGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.5, 8);
        const trunkMat = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 0.75;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        // الأوراق (تختلف حسب النوع)
        let leafGeo;
        if (type === 'pine') {
            // شجرة صنوبر (مخروطية)
            leafGeo = new THREE.ConeGeometry(0.8, 2, 8);
        } else {
            // شجرة عادية (كروية)
            leafGeo = new THREE.SphereGeometry(0.7, 8, 8);
        }

        const leafMat = new THREE.MeshPhongMaterial({ color: type === 'pine' ? 0x0B5345 : 0x228B22 });
        const leaves = new THREE.Mesh(leafGeo, leafMat);
        leaves.position.y = 2;
        leaves.castShadow = true;
        treeGroup.add(leaves);

        treeGroup.position.set(x, 0, z);
        scene.add(treeGroup);
    }

    // توزيع أشجار عشوائية في العالم
    for (let i = 0; i < 20; i++) {
        const x = Math.random() * 40 - 20;
        const z = Math.random() * 40 - 20;
        const type = Math.random() > 0.5 ? 'pine' : 'round';
        if (Math.abs(x) > 2 || Math.abs(z) > 2) { // تجنب وضع الأشجار فوق المكعب
            createTree(x, z, type);
        }
    }

    // 9. حلقة التحريك (Animation Loop)
    function animate() {
        requestAnimationFrame(animate);
        
        // تحريك المكعب قليلاً لإضافة حياة
        cube.rotation.y += 0.01;
        
        controls.update();
        renderer.render(scene, camera);
    }

    // التعامل مع تغيير حجم النافذة
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
