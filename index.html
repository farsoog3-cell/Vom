<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine Pro | Nature Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(10, 10, 10, 0.85); --border: rgba(222, 255, 154, 0.3); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .ui-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; transition: 0.3s; }
        .ui-overlay.hidden { opacity: 0; pointer-events: none; }
        .ui-overlay * { pointer-events: auto; }

        .corner-panel {
            position: absolute; background: var(--glass); padding: 15px; border-radius: 12px;
            border: 1px solid var(--border); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        
        .top-left { top: 20px; left: 20px; } 
        .top-right { top: 20px; right: 20px; width: 180px; }
        .bottom-left { bottom: 20px; left: 20px; width: 220px; }
        .bottom-right { bottom: 20px; right: 20px; }

        .mode-toggle {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border);
        }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px 12px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: center;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }
        .btn-play { border-radius: 20px; padding: 8px 25px; }

        .label { font-size: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; display: block; }
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        #viewport { width: 100vw; height: 100vh; cursor: crosshair; }
        
        .helper-text { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #888; pointer-events: none; }
    </style>
</head>
<body>

    <div class="mode-toggle">
        <button class="btn btn-play active" id="edit-mode-btn" onclick="toggleViewMode(false)">وضع البناء (Edit)</button>
        <button class="btn btn-play" id="view-mode-btn" onclick="toggleViewMode(true)">وضع الرؤية (Play)</button>
    </div>

    <div class="ui-overlay" id="editor-ui">
        <div class="corner-panel top-left">
            <span class="label">أدوات التحويل</span>
            <button class="btn active" id="mode-translate" onclick="setMode('translate')">تحريك (G)</button>
            <button class="btn" id="mode-rotate" onclick="setMode('rotate')">تدوير (R)</button>
            <button class="btn" id="mode-scale" onclick="setMode('scale')">تحجيم (S)</button>
        </div>

        <div class="corner-panel top-right">
            <span class="label">إضافة عناصر طبيعية</span>
            <select id="tree-type" class="btn" onchange="spawn('tree', this.value); this.value=''">
                <option value="">+ إضافة شجرة</option>
                <option value="oak">🌳 بلوط</option>
                <option value="pine">🌲 صنوبر</option>
                <option value="palm">🌴 نخلة</option>
            </select>
            <button class="btn" onclick="spawn('grass')">🌱 إضافة أعشاب</button>
            
            <span class="label">الأرضية</span>
            <button class="btn" onclick="setGround('flat')">🟩 مسطحة</button>
            <button class="btn" onclick="setGround('mountains')">⛰️ تضاريس</button>
        </div>

        <div class="corner-panel bottom-left">
            <span class="label">إعدادات البيئة</span>
            <button class="btn" onclick="selectSun()">☀️ التحكم في الشمس</button>
            <span class="label">شدة الضوء</span>
            <input type="range" id="sun-val" min="0" max="2" step="0.1" value="1" oninput="updateSun()">
            <span class="label">سرعة الرياح</span>
            <input type="range" id="wind-val" min="0" max="0.1" step="0.01" value="0.02" oninput="updateWind()">
        </div>

        <div class="corner-panel bottom-right">
            <span class="label">الأشكال</span>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                <button class="btn" onclick="spawn('cube')">📦 مكعب</button>
                <button class="btn" onclick="spawn('sphere')">🔮 كرة</button>
            </div>
            <button class="btn" onclick="deleteSelected()" style="color:#ff4444; margin-top:5px; border-color: #552222;">حذف المختار (Del)</button>
        </div>

        <div class="helper-text">انقر لاختيار أي عنصر | اسحب الماوس لتدوير الكاميرا</div>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, raycaster, mouse;
    let ground, sunLight, sunSphere, gridHelper;
    let objects = [], windObjects = [];
    let selectedObj = null, windStrength = 0.02;
    let isViewMode = false;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a10);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // الإضاءة
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        
        sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // مجسم الشمس (للتحكم بها بصرياً)
        sunSphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffdd00 })
        );
        sunSphere.position.copy(sunLight.position);
        sunSphere.userData.isSun = true;
        scene.add(sunSphere);
        objects.push(sunSphere);

        gridHelper = new THREE.GridHelper(50, 50, 0x333333, 0x222222);
        scene.add(gridHelper);

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => {
            orbit.enabled = !e.value;
            if(!e.value && selectedObj === sunSphere) {
                sunLight.position.copy(sunSphere.position);
            }
        });

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('resize', onResize);

        setGround('flat');
        animate();
    }

    function toggleViewMode(view) {
        isViewMode = view;
        document.getElementById('editor-ui').className = view ? 'ui-overlay hidden' : 'ui-overlay';
        document.getElementById('edit-mode-btn').classList.toggle('active', !view);
        document.getElementById('view-mode-btn').classList.toggle('active', view);
        
        gridHelper.visible = !view;
        sunSphere.visible = !view;
        if(view) transform.detach();
    }

    function setGround(type) {
        if(ground) scene.remove(ground);
        let geo = new THREE.PlaneGeometry(100, 100, 40, 40);
        let mat = new THREE.MeshStandardMaterial({color: 0x1a2e1a, roughness: 0.8});

        if(type === 'mountains') {
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i), y = pos.getY(i);
                pos.setZ(i, Math.sin(x*0.1) * Math.cos(y*0.1) * 5);
            }
            geo.computeVertexNormals();
            scene.background = new THREE.Color(0x87ceeb);
        } else {
            scene.background = new THREE.Color(0x050505);
        }
        
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    function spawn(type, sub) {
        let obj;
        if(type === 'tree') obj = createTree(sub);
        else if(type === 'grass') obj = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.8, 3), new THREE.MeshStandardMaterial({color: 0x44aa44}));
        else if(type === 'cube') obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xdeff9a}));
        else obj = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), new THREE.MeshStandardMaterial({color: 0xdeff9a}));

        obj.position.set(Math.random()*10-5, 1, Math.random()*10-5);
        obj.castShadow = true;
        obj.receiveShadow = true;
        scene.add(obj);
        objects.push(obj);
        if(type === 'tree' || type === 'grass') windObjects.push(obj);
        select(obj);
    }

    function createTree(sub) {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 3), new THREE.MeshStandardMaterial({color: 0x3d2000}));
        trunk.position.y = 1.5;
        
        let leafGeo = new THREE.SphereGeometry(1.5, 8, 8);
        let leafCol = 0x228b22;
        if(sub === 'pine') { leafGeo = new THREE.ConeGeometry(1.5, 4, 8); leafCol = 0x1a331a; }
        if(sub === 'palm') { leafGeo = new THREE.TorusGeometry(1, 0.3, 8, 20); leafCol = 0x2e7d32; }

        const leaves = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({color: leafCol}));
        leaves.position.y = sub === 'pine' ? 4 : 3;
        group.add(trunk, leaves);
        group.type = "Tree_" + sub;
        return group;
    }

    function onMouseDown(e) {
        if(isViewMode || e.target.tagName !== 'CANVAS') return;
        mouse.x = (e.clientX/window.innerWidth)*2-1;
        mouse.y = -(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            let t = intersects[0].object;
            while(t.parent && t.parent !== scene) t = t.parent;
            select(t);
        } else {
            transform.detach();
            selectedObj = null;
        }
    }

    function select(obj) {
        selectedObj = obj;
        transform.attach(obj);
    }

    function selectSun() { select(sunSphere); setMode('translate'); }

    function setMode(m) {
        transform.setMode(m);
        document.querySelectorAll('.top-left .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('mode-' + m).classList.add('active');
    }

    function onKeyDown(e) {
        if(isViewMode) return;
        if(e.key.toLowerCase() === 'g') setMode('translate');
        if(e.key.toLowerCase() === 'r') setMode('rotate');
        if(e.key.toLowerCase() === 's') setMode('scale');
        if(e.key === 'Delete') deleteSelected();
    }

    function updateSun() { sunLight.intensity = document.getElementById('sun-val').value; }
    function updateWind() { windStrength = parseFloat(document.getElementById('wind-val').value); }

    function deleteSelected() {
        if(selectedObj && !selectedObj.userData.isSun) {
            scene.remove(selectedObj);
            objects = objects.filter(o => o !== selectedObj);
            windObjects = windObjects.filter(o => o !== selectedObj);
            transform.detach();
            selectedObj = null;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        let time = Date.now() * 0.002;
        
        windObjects.forEach(obj => {
            obj.rotation.x = Math.sin(time) * windStrength;
        });

        orbit.update();
        renderer.render(scene, camera);
    }

    function onResize() {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
</script>
</body>
</html>
