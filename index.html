<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine Pro Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(15, 15, 15, 0.95); --border: rgba(222, 255, 154, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        /* توزيع القوائم في الزوايا الأربعة */
        .panel {
            position: absolute; background: var(--glass); padding: 12px; border-radius: 12px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }
        
        .top-right { top: 20px; right: 20px; width: 170px; }
        .top-left { top: 20px; left: 20px; width: 170px; }
        .bottom-right { bottom: 20px; right: 20px; width: 210px; }
        .bottom-left { bottom: 20px; left: 20px; }

        .label { font-size: 11px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 4px; }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 10px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: right;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        .mode-selector {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border); z-index: 200;
        }

        #viewport { position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

    <div class="mode-selector">
        <button class="btn active" id="btn-edit" style="border-radius:20px; width:85px;" onclick="setView(false)">تعديل</button>
        <button class="btn" id="btn-view" style="border-radius:20px; width:85px;" onclick="setView(true)">رؤية</button>
    </div>

    <div class="panel top-right">
        <div class="label">➕ إضافة مجسمات</div>
        <button class="btn" onclick="spawn('tree')">🌳 إضافة شجرة</button>
        <button class="btn" onclick="spawn('grass')">🌱 إضافة أعشاب</button>
        <button class="btn" onclick="spawn('cube')">📦 إضافة مكعب</button>
    </div>

    <div class="panel top-left">
        <div class="label">🔧 أدوات التحكم</div>
        <button class="btn active" id="m-t" onclick="setTMode('translate')">التحريك (G)</button>
        <button class="btn" id="m-r" onclick="setTMode('rotate')">التدوير (R)</button>
        <button class="btn" id="m-s" onclick="setTMode('scale')">التكبير/التصغير (S)</button>
    </div>

    <div class="panel bottom-right">
        <div class="label">🌍 أنواع الأرض</div>
        <button class="btn" onclick="changeGround('green')">🟩 أرض خضراء</button>
        <button class="btn" onclick="changeGround('sand')">🟨 أرض رملية</button>
        <button class="btn" onclick="changeGround('mtn')">⛰️ تضاريس وعرة</button>
        
        <div class="label">🍃 قوة الرياح</div>
        <input type="range" min="0" max="0.1" step="0.01" value="0.03" oninput="windStrength = parseFloat(this.value)">
        
        <div class="label">☀️ شدة الشمس</div>
        <input type="range" min="0" max="2" step="0.1" value="1.2" oninput="sunLight.intensity = this.value">
    </div>

    <div class="panel bottom-left">
        <button class="btn" style="color:#ff5555; border-color:#522;" onclick="deleteObj()">حذف المختار</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, sunLight, ground, grid;
    let objects = [], windObjects = [];
    let windStrength = 0.03;

    // تشغيل المحرك
    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15); // وضعية كاميرا مثالية عند البدء

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // 1. شمس المشهد (إضاءة قوية)
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 2. الشبكة (Grid) تظهر فوراً
        grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        scene.add(grid);

        // 3. إنشاء الأرضية الخضراء فوراً
        changeGround('green');

        // 4. مكعب البداية في المنتصف (0,1,0)
        spawn('cube', true); 

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // نظام النقر لاختيار أي مجسم والتحكم به
        window.addEventListener('mousedown', (e) => {
            if(e.target.tagName !== 'CANVAS') return;
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, true);
            if(intersects.length > 0) {
                let target = intersects[0].object;
                while(target.parent && target.parent !== scene) target = target.parent;
                transform.attach(target);
            }
        });

        animate();
    }

    function changeGround(type) {
        if(ground) scene.remove(ground);
        const geo = new THREE.PlaneGeometry(100, 100, 40, 40);
        let color = 0x1d2b1d;
        if(type === 'sand') color = 0xc2b280;
        if(type === 'mtn') color = 0x333333;
        
        const mat = new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide });
        if(type === 'mtn') {
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                pos.setZ(i, Math.sin(x*0.2) * Math.cos(y*0.2) * 2);
            }
        }
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    function spawn(type, isInitial = false) {
        let obj;
        if(type === 'tree') {
            obj = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2.5), new THREE.MeshStandardMaterial({color: 0x4d2600}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({color: 0x1a5a1a}));
            leaves.position.y = 2;
            obj.add(trunk, leaves);
            windObjects.push(obj);
        } else if(type === 'grass') {
            obj = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.8, 3), new THREE.MeshStandardMaterial({color: 0x44ff44}));
            windObjects.push(obj);
        } else {
            obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xdeff9a}));
        }
        
        if(isInitial) obj.position.set(0, 1, 0);
        else obj.position.set(Math.random()*10-5, 1, Math.random()*10-5);
        
        obj.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        scene.add(obj);
        objects.push(obj);
        transform.attach(obj);
    }

    function setTMode(m) {
        transform.setMode(m); // هنا يتم التبديل بين (translate, rotate, scale)
        document.querySelectorAll('.top-left .btn').forEach(b => b.classList.remove('active'));
        if(m === 'translate') document.getElementById('m-t').classList.add('active');
        if(m === 'rotate') document.getElementById('m-r').classList.add('active');
        if(m === 'scale') document.getElementById('m-s').classList.add('active');
    }

    function deleteObj() {
        if(transform.object) {
            const o = transform.object;
            scene.remove(o);
            objects = objects.filter(i => i !== o);
            windObjects = windObjects.filter(i => i !== o);
            transform.detach();
        }
    }

    function setView(isView) {
        document.querySelectorAll('.panel').forEach(p => p.style.display = isView ? 'none' : 'flex');
        if(isView) { transform.detach(); grid.visible = false; }
        else { grid.visible = true; }
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.002;
        windObjects.forEach(o => {
            o.rotation.z = Math.sin(time) * windStrength;
        });
        orbit.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
