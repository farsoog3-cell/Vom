<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine Pro | Fixed Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --bg: #111; --panel: #1a1a1a; --border: #333; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; }
        
        .editor { display: flex; height: 100vh; width: 100vw; }
        
        /* القوائم الجانبية */
        .sidebar { width: 220px; background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
        .viewport-container { flex-grow: 1; position: relative; background: #000; }
        
        .panel-sec { padding: 12px; border-bottom: 1px solid var(--border); }
        .p-title { font-size: 11px; color: var(--primary); font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }

        .btn {
            background: #222; border: 1px solid var(--border); color: white; padding: 8px;
            border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: right; width: 100%; margin-bottom: 4px;
        }
        .btn:hover { border-color: var(--primary); background: #2a2a2a; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        .top-tools { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100; background: var(--panel); padding: 5px; border-radius: 30px; display: flex; gap: 5px; border: 1px solid var(--border); }

        #scene-tree { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; background: #000; border-radius: 4px; }
        #scene-tree li { padding: 5px 10px; font-size: 11px; cursor: pointer; border-bottom: 1px solid #111; }
        #scene-tree li:hover { background: #333; }
        #scene-tree li.selected { background: var(--primary); color: #000; }

        input { width: 100%; accent-color: var(--primary); background: #000; border: 1px solid #444; color: white; border-radius: 3px; padding: 2px; }
    </style>
</head>
<body>

<div class="editor">
    <aside class="sidebar">
        <div class="panel-sec">
            <div class="p-title">🔧 أدوات التحويل</div>
            <button class="btn active" id="m-t" onclick="setTMode('translate')">التحريك (G)</button>
            <button class="btn" id="m-r" onclick="setTMode('rotate')">التدوير (R)</button>
            <button class="btn" id="m-s" onclick="setTMode('scale')">التكبير/التصغير (S)</button>
        </div>
        <div class="panel-sec">
            <div class="p-title">🌳 إضافة طبيعة</div>
            <button class="btn" onclick="spawn('tree')">إضافة شجرة</button>
            <button class="btn" onclick="spawn('grass')">إضافة أعشاب</button>
        </div>
        <div class="panel-sec">
            <div class="p-title">📦 إضافة أشكال</div>
            <button class="btn" onclick="spawn('cube')">إضافة مكعب</button>
        </div>
        <div class="panel-sec" style="margin-top: auto;">
            <button class="btn" style="color: #ff5555;" onclick="deleteObj()">🗑️ حذف المختار</button>
        </div>
    </aside>

    <main class="viewport-container" id="viewport">
        <div class="top-tools">
            <button class="btn active" id="edit-mode" onclick="setView(false)" style="width:70px; margin:0;">تعديل</button>
            <button class="btn" id="view-mode" onclick="setView(true)" style="width:70px; margin:0;">رؤية</button>
        </div>
    </main>

    <aside class="sidebar">
        <div class="panel-sec">
            <div class="p-title">🔍 مستكشف العناصر</div>
            <ul id="scene-tree"></ul>
        </div>
        <div class="panel-sec">
            <div class="p-title">📝 خصائص العنصر</div>
            <div style="font-size:10px;">الاسم:</div>
            <input type="text" id="obj-name" oninput="updateName(this.value)">
            <div style="font-size:10px; margin-top:10px;">اللون:</div>
            <input type="color" id="obj-color" oninput="updateColor(this.value)">
        </div>
        <div class="panel-sec">
            <div class="p-title">🌍 البيئة والعالم</div>
            <div style="font-size:10px;">نوع الأرض:</div>
            <select class="btn" onchange="changeGround(this.value)">
                <option value="green">أرض خضراء</option>
                <option value="sand">رمال</option>
                <option value="mtn">تضاريس</option>
            </select>
            <div style="font-size:10px; margin-top:5px;">قوة الرياح:</div>
            <input type="range" min="0" max="0.1" step="0.01" value="0.03" oninput="windStrength = parseFloat(this.value)">
        </div>
    </aside>
</div>

<script>
    let scene, camera, renderer, orbit, transform, sunLight, ground, grid;
    let objects = [], windObjects = [];
    let windStrength = 0.03;
    let selectedObject = null;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        // حساب العرض الصحيح للمشهد مع طرح مساحة القوائم
        const w = window.innerWidth - 440; 
        camera = new THREE.PerspectiveCamera(60, w / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // إضاءة الشمس
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // الشبكة (Grid) - أساسية جداً
        grid = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
        scene.add(grid);

        // الأرضية
        changeGround('green');

        // مكعب البداية
        spawn('cube', true);

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        // نظام الاختيار
        window.addEventListener('mousedown', (e) => {
            if(e.target.tagName !== 'CANVAS') return;
            const mouse = new THREE.Vector2();
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, true);
            
            if(intersects.length > 0) {
                let target = intersects[0].object;
                while(target.parent && target.parent !== scene) target = target.parent;
                selectObject(target);
            }
        });

        animate();
    }

    function spawn(type, isInitial = false) {
        let obj;
        let name = type + "_" + Math.floor(Math.random()*999);
        if(type === 'tree') {
            obj = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,2.5), new THREE.MeshStandardMaterial({color:0x4d2600}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({color:0x1a5a1a}));
            leaves.position.y = 2;
            obj.add(trunk, leaves);
            windObjects.push(obj);
        } else if(type === 'grass') {
            obj = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.8, 3), new THREE.MeshStandardMaterial({color: 0x44ff44}));
            windObjects.push(obj);
        } else {
            obj = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xdeff9a}));
        }
        
        obj.name = name;
        obj.position.set(isInitial?0:Math.random()*10-5, 1, isInitial?0:Math.random()*10-5);
        obj.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        scene.add(obj);
        objects.push(obj);
        updateTree();
        selectObject(obj);
    }

    function selectObject(obj) {
        selectedObject = obj;
        transform.attach(obj);
        document.getElementById('obj-name').value = obj.name;
        updateTree();
    }

    function updateTree() {
        const tree = document.getElementById('scene-tree');
        tree.innerHTML = "";
        objects.forEach(o => {
            const li = document.createElement('li');
            li.innerText = o.name;
            if(selectedObject === o) li.className = "selected";
            li.onclick = () => selectObject(o);
            tree.appendChild(li);
        });
    }

    function updateName(v) { if(selectedObject) { selectedObject.name = v; updateTree(); } }
    function updateColor(v) { if(selectedObject) selectedObject.traverse(c=>{if(c.isMesh) c.material.color.set(v)}); }

    function setTMode(m) {
        transform.setMode(m);
        document.querySelectorAll('.panel-sec .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m[0]).classList.add('active');
    }

    function changeGround(type) {
        if(ground) scene.remove(ground);
        const geo = new THREE.PlaneGeometry(100, 100);
        let color = 0x1a241a;
        if(type === 'sand') color = 0xc2b280;
        if(type === 'mtn') color = 0x333333;
        const mat = new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide });
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
    }

    function deleteObj() {
        if(selectedObject) {
            scene.remove(selectedObject);
            objects = objects.filter(i => i !== selectedObject);
            windObjects = windObjects.filter(i => i !== selectedObject);
            transform.detach();
            selectedObject = null;
            updateTree();
        }
    }

    function setView(isView) {
        document.querySelectorAll('.sidebar').forEach(s => s.style.display = isView ? 'none' : 'flex');
        grid.visible = !isView;
        if(isView) transform.detach();
        onResize();
        document.getElementById('edit-mode').classList.toggle('active', !isView);
        document.getElementById('view-mode').classList.toggle('active', isView);
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = Date.now() * 0.002;
        windObjects.forEach(o => { o.rotation.z = Math.sin(t) * windStrength; });
        orbit.update();
        renderer.render(scene, camera);
    }

    function onResize() {
        const isHidden = document.querySelector('.sidebar').style.display === 'none';
        const w = window.innerWidth - (isHidden ? 0 : 440);
        camera.aspect = w / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(w, window.innerHeight);
    }

    window.addEventListener('resize', onResize);
</script>
</body>
</html>
