<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | نظام تحريك XYZ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
        #splash { position: fixed; inset: 0; background: #0a0a0a; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-box { background: #222; padding: 30px; border-radius: 15px; border: 1px solid #deff9a; text-align: center; }
        input[type="text"] { padding: 12px; width: 250px; border-radius: 5px; border: none; margin: 15px 0; font-size: 16px; }
        .layout { display: grid; grid-template-columns: 200px 1fr 280px; height: 100vh; visibility: hidden; }
        .sidebar { background: #202020; padding: 15px; border: 1px solid #333; }
        #canvas-container { background: #393939; position: relative; }
        .btn { background: #deff9a; color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .info-panel { background: #111; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; color: #deff9a; margin-top: 10px; }
    </style>
</head>
<body>

<div id="splash">
    <div class="input-box">
        <h1 style="color: #deff9a;">NEO-ENGINE</h1>
        <input type="text" id="pName" placeholder="اسم المشروع...">
        <br>
        <button class="btn" onclick="start()">دخول بيئة التصنيع</button>
    </div>
</div>

<div class="layout" id="editor">
    <aside class="sidebar">
        <h4 style="color: #deff9a;">Hierarchy</h4>
        <p>📦 Cube (المكعب)</p>
    </aside>
    
    <main id="canvas-container"></main>
    
    <aside class="sidebar">
        <h4 style="color: #deff9a;">Inspector</h4>
        <p style="font-size: 13px; color: #aaa;">تحكم في المحاور مباشرة من خلال سحب الأسهم (Red: X, Green: Y, Blue: Z)</p>
        
        <div class="info-panel" id="pos-display">
            X: 0.00 | Y: 0.50 | Z: 0.00
        </div>

        <button class="btn" style="background: #444; color: white;" onclick="resetCamera()">إعادة ضبط الكاميرا</button>
    </aside>
</div>

<script>
    let scene, camera, renderer, cube, controls, transformControls;

    function start() {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('editor').style.visibility = 'visible';
        init3D();
    }

    function init3D() {
        const container = document.getElementById('canvas-container');

        // 1. المشهد
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x393939);

        // 2. الكاميرا
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        // 3. المحرك
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // 4. الإضاءة
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // 5. الأرضية (Grid) والمحاور الأساسية
        const grid = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
        scene.add(grid);

        // 6. المكعب
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshPhongMaterial({ color: 0xdeff9a });
        cube = new THREE.Mesh(geometry, material);
        cube.position.y = 0.5;
        scene.add(cube);

        // 7. تحريك الكاميرا (Orbit)
        controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 8. --- إضافة أداة تحريك المحاور (Transform Gizmo) مثل بلندر ---
        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.attach(cube); // ربط الأداة بالمكعب
        scene.add(transformControls);

        // منع تداخل الكاميرا مع سحب المحاور
        transformControls.addEventListener('dragging-changed', function (event) {
            controls.enabled = !event.value;
        });

        // تحديث أرقام الموقع عند التحريك
        transformControls.addEventListener('change', () => {
            const p = cube.position;
            document.getElementById('pos-display').innerHTML = 
                `X: ${p.x.toFixed(2)} | Y: ${p.y.toFixed(2)} | Z: ${p.z.toFixed(2)}`;
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    function resetCamera() {
        camera.position.set(5, 5, 5);
        controls.update();
    }

    window.addEventListener('resize', () => {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
