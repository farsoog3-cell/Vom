<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | Full Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --glass: rgba(15, 15, 15, 0.9); --border: rgba(222, 255, 154, 0.2); }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        
        /* توزيع القوائم في الزوايا كما في المحركات الاحترافية */
        .panel {
            position: absolute; background: var(--glass); padding: 12px; border-radius: 12px;
            border: 1px solid var(--border); backdrop-filter: blur(10px); z-index: 100;
            display: flex; flex-direction: column; gap: 8px; max-height: 80vh; overflow-y: auto;
        }
        
        .top-right { top: 20px; right: 20px; width: 180px; }
        .top-left { top: 20px; left: 20px; width: 150px; }
        .bottom-left { bottom: 20px; left: 20px; width: 200px; }
        .bottom-right { bottom: 20px; right: 20px; }

        .category-header { font-size: 11px; color: var(--primary); border-bottom: 1px solid var(--border); padding: 5px 0; margin-top: 5px; }

        .btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 8px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 12px; text-align: right;
        }
        .btn:hover { background: var(--primary); color: black; }
        .btn.active { background: var(--primary); color: black; font-weight: bold; }

        .mode-selector {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; background: var(--glass); padding: 5px; border-radius: 30px; border: 1px solid var(--border); z-index: 200;
        }

        #viewport { position: absolute; inset: 0; z-index: 1; }
    </style>
</head>
<body>

    <div class="mode-selector">
        <button class="btn active" id="btn-edit" style="border-radius:20px; width:80px;" onclick="setView(false)">تعديل</button>
        <button class="btn" id="btn-view" style="border-radius:20px; width:80px;" onclick="setView(true)">رؤية</button>
    </div>

    <div class="panel top-right" id="ui-assets">
        <div class="category-header">🌳 الأشجار (مخفي/فتح)</div>
        <button class="btn" onclick="spawn('tree', 'oak')">شجرة بلوط</button>
        <button class="btn" onclick="spawn('tree', 'pine')">شجرة صنوبر</button>

        <div class="category-header">🌱 الحشائش</div>
        <button class="btn" onclick="spawn('grass')">حشائش برية</button>

        <div class="category-header">🌊 البحار والماء</div>
        <button class="btn" onclick="updateWater('blue')">بحر أزرق</button>
        <button class="btn" onclick="updateWater('clear')">مياه صافية</button>

        <div class="category-header">⛰️ الجبال</div>
        <button class="btn" onclick="setGround('mtn')">جبال صخرية</button>
        <button class="btn" onclick="setGround('hills')">تلال ناعمة</button>

        <div class="category-header">☁️ الغيوم</div>
        <button class="btn" onclick="spawn('cloud')">إضافة غيمة</button>
    </div>

    <div class="panel top-left" id="ui-tools">
        <div class="category-header">🖌️ الفرشاة والنحت</div>
        <button class="btn active" id="m-t" onclick="setTMode('translate')">تحريك (G)</button>
        <button class="btn" id="m-r" onclick="setTMode('rotate')">تدوير (R)</button>
        <button class="btn" id="m-s" onclick="setTMode('scale')">تحجيم (S)</button>
        <button class="btn" onclick="setTool('paint')">تلوين</button>
    </div>

    <div class="panel bottom-left" id="ui-env">
        <div class="category-header">☀️ الشمس والإضاءة</div>
        <input type="range" min="0" max="2" step="0.1" value="1.2" oninput="sunLight.intensity = this.value">
        <button class="btn" onclick="setEnv('sunset')">وقت الغروب</button>
        
        <div class="category-header">🍃 الرياح</div>
        <input type="range" min="0" max="0.1" step="0.01" value="0.03" oninput="windStrength = parseFloat(this.value)">
    </div>

    <div class="panel bottom-right" id="ui-delete">
        <button class="btn" style="color:#ff5555" onclick="deleteObj()">حذف العنصر</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, sunLight, ground;
    let objects = [], windObjects = [];
    let windStrength = 0.03;

    init();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(30, 50, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // إنشاء الأرضية فوراً
        createGround();

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);

        window.addEventListener('mousedown', onSelect);
        animate();
    }

    function createGround() {
        if(ground) scene.remove(ground);
        const geo = new THREE.PlaneGeometry(100, 100, 20, 20);
        const mat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, side: THREE.DoubleSide });
        ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        const grid = new THREE.GridHelper(100, 50, 0x333333, 0x222222);
        grid.position.y = 0.01;
        scene.add(grid);
    }

    function spawn(type, variant) {
        let obj;
        if(type === 'tree') {
            obj = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3), new THREE.MeshStandardMaterial({color: 0x4d2600}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshStandardMaterial({color: variant==='oak'? 0x1a5a1a : 0x0a330a}));
            leaves.position.y = 2.5;
            obj.add(trunk, leaves);
            windObjects.push(obj);
        } else if(type === 'grass') {
            obj = new THREE.Mesh(new THREE.ConeGeometry(0.1, 1, 3), new THREE.MeshStandardMaterial({color: 0x44ff44}));
            windObjects.push(obj);
        } else if(type === 'cloud') {
            obj = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshStandardMaterial({color: 0xffffff, transparent: true, opacity: 0.8}));
            obj.position.y = 10;
        }

        obj.position.set(Math.random()*10-5, 0, Math.random()*10-5);
        if(type === 'cloud') obj.position.y = 10;
        
        obj.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        scene.add(obj);
        objects.push(obj);
        transform.attach(obj);
    }

    function onSelect(e) {
        if(e.target.tagName !== 'CANVAS') return;
        const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            let t = intersects[0].object;
            while(t.parent && t.parent !== scene) t = t.parent;
            transform.attach(t);
        }
    }

    function setTMode(m) {
        transform.setMode(m);
        document.querySelectorAll('.top-left .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+m[0]).classList.add('active');
    }

    function setGround(type) {
        if(type === 'mtn') {
            ground.scale.set(1, 1, 2);
            ground.material.color.set(0x333333);
        } else {
            ground.scale.set(1, 1, 1);
            ground.material.color.set(0x1a1a1a);
        }
    }

    function updateWater(color) {
        ground.material.color.set(color === 'blue' ? 0x0044ff : 0x00ffff);
        ground.material.opacity = 0.7;
        ground.material.transparent = true;
    }

    function deleteObj() {
        if(transform.object) {
            const target = transform.object;
            scene.remove(target);
            objects = objects.filter(o => o !== target);
            windObjects = windObjects.filter(o => o !== target);
            transform.detach();
        }
    }

    function setView(isView) {
        document.querySelectorAll('.panel').forEach(p => p.style.display = isView ? 'none' : 'flex');
        document.getElementById('btn-edit').classList.toggle('active', !isView);
        document.getElementById('btn-view').classList.toggle('active', isView);
        if(isView) transform.detach();
    }

    function animate() {
        requestAnimationFrame(animate);
        // الرياح
        const time = Date.now() * 0.002;
        windObjects.forEach(obj => {
            obj.rotation.z = Math.sin(time) * windStrength;
        });
        orbit.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
