<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | نظام التحكم الاحترافي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
        #splash { position: fixed; inset: 0; background: #0a0a0a; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .input-box { background: #222; padding: 30px; border-radius: 15px; border: 1px solid #deff9a; text-align: center; }
        input[type="text"] { padding: 12px; width: 250px; border-radius: 5px; border: none; margin: 15px 0; font-size: 16px; }
        .layout { display: grid; grid-template-columns: 200px 1fr 280px; height: 100vh; visibility: hidden; }
        .sidebar { background: #202020; padding: 15px; border: 1px solid #333; overflow-y: auto; }
        #canvas-container { background: #393939; position: relative; }
        .btn { background: #deff9a; color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px 0; width: 100%; }
        .mode-btn { background: #444; color: white; border: 1px solid #666; padding: 5px; cursor: pointer; width: 30%; font-size: 12px; }
        .active-mode { background: #deff9a; color: black; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div id="splash">
    <div class="input-box">
        <h1 style="color: #deff9a;">NEO-ENGINE</h1>
        <input type="text" id="pName" placeholder="اسم اللعبة...">
        <br>
        <button class="btn" onclick="start()">بدء التصنيع</button>
    </div>
</div>

<div class="layout" id="editor">
    <aside class="sidebar">
        <h4 style="color: #deff9a;">Hierarchy</h4>
        <div style="background: #333; padding: 5px; border-radius: 3px;">📦 Cube</div>
    </aside>
    
    <main id="canvas-container"></main>
    
    <aside class="sidebar">
        <h4 style="color: #deff9a;">Inspector</h4>
        
        <label>وضع التحكم (Transform Mode):</label>
        <div style="display: flex; gap: 5px; margin-top: 5px;">
            <button class="mode-btn active-mode" id="m-translate" onclick="setMode('translate')">تحريك</button>
            <button class="mode-btn" id="m-rotate" onclick="setMode('rotate')">تدوير</button>
            <button class="mode-btn" id="m-scale" onclick="setMode('scale')">تكبير</button>
        </div>

        <label>إحداثيات الموقع (X, Y, Z):</label>
        <div id="pos-info" style="font-family: monospace; color: #deff9a; background: #111; padding: 10px; margin-top: 5px; border-radius: 5px;">
            X: 0.00 | Y: 0.50 | Z: 0.00
        </div>

        <label>خيارات إضافية:</label>
        <button class="btn" style="background: #ff5555; color: white;" onclick="resetObject()">إعادة ضبط</button>
    </aside>
</div>

<script>
    let scene, camera, renderer, cube, controls, transformControls;

    function start() {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('editor').style.visibility = 'visible';
        init3D();
    }

    function init3D() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x393939);

        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // الإضاءة
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // الأرضية والمحاور
        scene.add(new THREE.GridHelper(20, 20, 0x888888, 0x444444));
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // المكعب
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshPhongMaterial({ color: 0xdeff9a });
        cube = new THREE.Mesh(geometry, material);
        cube.position.y = 0.5;
        scene.add(cube);

        // التحكم بالكاميرا
        controls = new THREE.OrbitControls(camera, renderer.domElement);

        // --- إضافة أدوات التحكم بالمجسم (Gizmo) ---
        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.attach(cube);
        scene.add(transformControls);

        // تعطيل دوران الكاميرا أثناء سحب المجسم
        transformControls.addEventListener('dragging-changed', function (event) {
            controls.enabled = !event.value;
        });

        // تحديث معلومات الإحداثيات في اللوحة اليمنى عند التحريك
        transformControls.addEventListener('change', updateInfo);

        animate();
    }

    function setMode(mode) {
        transformControls.setMode(mode);
        // تحديث شكل الأزرار
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active-mode'));
        document.getElementById('m-' + mode).classList.add('active-mode');
    }

    function updateInfo() {
        if(cube) {
            const p = cube.position;
            document.getElementById('pos-info').innerHTML = 
                `X: ${p.x.toFixed(2)} | Y: ${p.y.toFixed(2)} | Z: ${p.z.toFixed(2)}`;
        }
    }

    function resetObject() {
        cube.position.set(0, 0.5, 0);
        cube.rotation.set(0, 0, 0);
        cube.scale.set(1, 1, 1);
        updateInfo();
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
