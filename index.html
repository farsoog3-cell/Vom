<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almaz Pro Engine | Full System</title>
    <style>
        :root { --gold: #f1c40f; --dark: #0f0f0f; }
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #ui-panel { position: absolute; top: 10px; right: 10px; width: 200px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid var(--gold); z-index: 100; color: white; }
        #terminal-box { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 500px; background: rgba(0,0,0,0.9); border: 1px solid var(--gold); padding: 10px; display: none; z-index: 1000; }
        #t-log { height: 80px; overflow-y: auto; color: #2ecc71; font-family: monospace; font-size: 12px; margin-bottom: 5px; }
        #terminal-input { width: 100%; background: transparent; border: none; color: white; outline: none; border-top: 1px solid #333; padding-top: 5px; }
        button { width: 100%; margin-bottom: 5px; padding: 8px; cursor: pointer; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
        .play-btn { background: #27ae60; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-panel">
    <h3 style="color:var(--gold); margin:0 0 10px 0; text-align:center;">الماس برو</h3>
    <button class="play-btn" onclick="window.engine.togglePlay()">🎮 وضع اللعب</button>
    <button onclick="window.terminal.toggle()">📟 الأوامر (T)</button>
    <button onclick="document.getElementById('fileIn').click()">📂 استيراد</button>
    <input type="file" id="fileIn" style="display:none" onchange="window.workshop.import(event)">
    <button onclick="window.workshop.exportGame()" style="background:#e67e22">📥 تصدير</button>
</div>

<div id="terminal-box">
    <div id="t-log">نظام الأوامر جاهز...</div>
    <input type="text" id="terminal-input" placeholder="اكتب أمرك هنا (مثلاً: sun أو car)...">
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
