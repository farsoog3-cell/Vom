<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك ألعاب متقدم - الإصدار 2.0</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 220px;
            user-select: none;
        }
        button {
            background: #444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }
        button:hover { background: #666; }
        .active-mode { background: #27ae60 !important; }
        .delete-btn { background: #c0392b !important; }
        .delete-btn:hover { background: #e74c3c !important; }
        .hint { font-size: 11px; color: #aaa; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

<div id="toolbar">
    <h3 style="margin:0 0 10px 0; text-align:center;">لوحة التحكم</h3>
    
    <button id="modeTranslate" class="active-mode">وضع التحريك (Arrows)</button>
    <button id="modeScale">وضع الشد والمط (Scale)</button>
    <hr style="width:100%; border:0; border-top:1px solid #444;">
    <button id="changeTrees">تغيير/تجديد الأشجار</button>
    <button id="changeGround">تغيير شكل الأرضية</button>
    <button id="deleteObject" class="delete-btn">حذف المجسم المحدد</button>
    
    <div class="hint">انقر على أي مجسم لاختياره واستخدام الأسهم</div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // --- الإعدادات الأساسية ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    scene.fog = new THREE.Fog(0x1a1a1a, 10, 50);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(15, 15, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- الإضاءة ---
    const sunLight = new THREE.DirectionalLight(0xffffff, 2);
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // --- الأرضية ---
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    scene.add(new THREE.GridHelper(50, 50, 0x333333, 0x333333));

    // --- أدوات التحكم ---
    const orbit = new OrbitControls(camera, renderer.domElement);
    
    const transformControl = new TransformControls(camera, renderer.domElement);
    scene.add(transformControl);

    // تعطيل تدوير الكاميرا عند استخدام الأسهم
    transformControl.addEventListener('dragging-changed', (event) => {
        orbit.enabled = !event.value;
    });

    // --- إدارة الكائنات ---
    let treesGroup = new THREE.Group();
    scene.add(treesGroup);

    const boxGeo = new THREE.BoxGeometry(2, 2, 2);
    const boxMat = new THREE.MeshPhongMaterial({ color: 0x3498db });
    const mainCube = new THREE.Mesh(boxGeo, boxMat);
    mainCube.position.y = 1;
    mainCube.castShadow = true;
    mainCube.name = "Cube";
    scene.add(mainCube);

    // إنشاء الأشجار
    function spawnTrees() {
        scene.remove(treesGroup);
        treesGroup = new THREE.Group();
        const colors = [0x2ecc71, 0x27ae60, 0x1e8449, 0xd4ac0d];
        
        for (let i = 0; i < 15; i++) {
            const tree = new THREE.Group();
            // جذع
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.5), new THREE.MeshPhongMaterial({color: 0x5d4037}));
            trunk.position.y = 0.75;
            tree.add(trunk);
            // أوراق
            const isPine = Math.random() > 0.5;
            const leafGeo = isPine ? new THREE.ConeGeometry(1, 2.5, 8) : new THREE.SphereGeometry(1, 8, 8);
            const leafMat = new THREE.MeshPhongMaterial({color: colors[Math.floor(Math.random()*colors.length)]});
            const leaves = new THREE.Mesh(leafGeo, leafMat);
            leaves.position.y = isPine ? 2.5 : 2.2;
            tree.add(leaves);

            tree.position.set(Math.random()*40-20, 0, Math.random()*40-20);
            tree.traverse(child => { if(child.isMesh) { child.castShadow = true; child.userData.parentGroup = tree; } });
            treesGroup.add(tree);
        }
        scene.add(treesGroup);
    }
    spawnTrees();

    // --- نظام التفاعل (Raycaster) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('mousedown', (event) => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects([mainCube, ...treesGroup.children], true);

        if (intersects.length > 0) {
            let object = intersects[0].object;
            // إذا كان الكائن جزءاً من شجرة، نختار الشجرة كاملة
            while(object.parent && object.parent !== scene && object.parent !== treesGroup) {
                object = object.parent;
            }
            transformControl.attach(object);
        } else if (!transformControl.dragging) {
            // transformControl.detach(); // اختياري: إلغاء الاختيار عند النقر في الفراغ
        }
    });

    // --- أزرار الواجهة ---
    document.getElementById('modeTranslate').onclick = (e) => {
        transformControl.setMode('translate');
        updateButtons(e.target);
    };

    document.getElementById('modeScale').onclick = (e) => {
        transformControl.setMode('scale');
        updateButtons(e.target);
    };

    document.getElementById('changeTrees').onclick = spawnTrees;

    document.getElementById('changeGround').onclick = () => {
        const colors = [0x1a1a1a, 0x2c3e50, 0x145a32, 0x641e16];
        ground.material.color.setHex(colors[Math.floor(Math.random()*colors.length)]);
    };

    document.getElementById('deleteObject').onclick = () => {
        if (transformControl.object) {
            const obj = transformControl.object;
            transformControl.detach();
            if (obj === mainCube) {
                scene.remove(obj);
            } else {
                treesGroup.remove(obj);
            }
        }
    };

    function updateButtons(activeBtn) {
        document.getElementById('modeTranslate').classList.remove('active-mode');
        document.getElementById('modeScale').classList.remove('active-mode');
        activeBtn.classList.add('active-mode');
    }

    // --- حلقة التحريك ---
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
