<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almaz Engine Pro | Professional Edition</title>
    <style>
        :root { --gold: #f1c40f; --bg-dark: rgba(15, 15, 15, 0.95); --accent: #3498db; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* لوحة الأدوات الجانبية */
        #editor-ui {
            position: absolute; top: 10px; right: 10px; width: 220px;
            background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 12px; color: white; z-index: 1000;
            backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        button { 
            padding: 10px; border-radius: 6px; border: none; cursor: pointer; 
            font-weight: bold; transition: 0.3s; background: #2c3e50; color: white;
        }
        button:hover { opacity: 0.8; transform: scale(1.02); }
        .play-btn { background: #2ecc71; }
        .export-btn { background: #e67e22; }

        /* لوحة الأوامر */
        #terminal-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px; background: rgba(0,0,0,0.8);
            border-left: 4px solid var(--gold); padding: 10px; display: none; z-index: 2000;
        }
        #terminal-input { width: 100%; background: transparent; border: none; color: #2ecc71; outline: none; font-family: monospace; }
        
        #mobile-joy { position: absolute; bottom: 40px; left: 40px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="editor-ui">
    <h3 style="margin:0; color:var(--gold); font-size:14px;">💎 Almaz Pro Engine</h3>
    <div class="btn-group">
        <button class="play-btn" onclick="window.engine.togglePlay()">🎮 وضع اللعب / تحرير</button>
        <button onclick="window.terminal.toggle()">📟 الأوامر (T)</button>
        <hr style="width:100%; border:0.5px solid #333;">
        <button onclick="document.getElementById('fileIn').click()">📂 استيراد من الورشة</button>
        <input type="file" id="fileIn" style="display:none" onchange="window.workshop.import(event)">
        <button class="export-btn" onclick="window.workshop.exportGame()">📥 تصدير اللعبة النهائية</button>
    </div>
</div>

<div id="terminal-box">
    <div id="t-log" style="color:#888; font-size:11px; margin-bottom:5px;">Terminal Ready...</div>
    <input type="text" id="terminal-input" placeholder="اكتب أمرك هنا...">
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
