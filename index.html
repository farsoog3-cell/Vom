<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محرك ألعاب متجاوب</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; touch-action: none; }
        
        /* زر إظهار/إخفاء القائمة */
        #menuToggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: #27ae60;
            color: white;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-weight: bold;
        }

        #toolbar {
            position: absolute;
            top: 60px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 160px; /* تقليل العرض ليناسب الجوال */
            transition: transform 0.3s ease;
            z-index: 99;
        }

        .hidden { transform: translateX(200%); }

        button {
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .active-mode { background: #27ae60 !important; border-color: #fff; }
        .delete-btn { background: #c0392b !important; }
        h4 { margin: 0; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<button id="menuToggle">القائمة ☰</button>

<div id="toolbar">
    <h4>التحكم</h4>
    <button id="modeTranslate" class="active-mode">تحريك (Arrows)</button>
    <button id="modeScale">شد ومط (Scale)</button>
    <button id="changeTrees">تجديد الأشجار</button>
    <button id="changeGround">تغيير الأرض</button>
    <button id="deleteObject" class="delete-btn">حذف المحدد</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // إخفاء وإظهار القائمة
    const toolbar = document.getElementById('toolbar');
    document.getElementById('menuToggle').onclick = () => {
        toolbar.classList.toggle('hidden');
    };

    // إعدادات المشهد
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 10, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // تحسين الجودة على الجوال
    document.body.appendChild(renderer.domElement);

    // الإضاءة
    const sunLight = new THREE.DirectionalLight(0xffffff, 2);
    sunLight.position.set(5, 10, 5);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // الأرضية والشبكة
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshPhongMaterial({ color: 0x228B22 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    scene.add(new THREE.GridHelper(40, 20, 0x444444, 0x444444));

    // التحكم
    const orbit = new OrbitControls(camera, renderer.domElement);
    const transformControl = new TransformControls(camera, renderer.domElement);
    scene.add(transformControl);

    transformControl.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    // المكعب
    const cube = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshPhongMaterial({ color: 0x3498db }));
    cube.position.y = 1;
    scene.add(cube);

    // نظام الأشجار
    let trees = new THREE.Group();
    scene.add(trees);

    function addTrees() {
        scene.remove(trees);
        trees = new THREE.Group();
        for(let i=0; i<10; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshPhongMaterial({color: 0x5d4037}));
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshPhongMaterial({color: 0x2ecc71}));
            leaves.position.y = 1;
            tree.add(trunk, leaves);
            tree.position.set(Math.random()*30-15, 0.5, Math.random()*30-15);
            trees.add(tree);
        }
        scene.add(trees);
    }
    addTrees();

    // التفاعل باللمس/الضغط
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const onSelect = (event) => {
        let clientX = event.clientX || (event.touches && event.touches[0].clientX);
        let clientY = event.clientY || (event.touches && event.touches[0].clientY);
        
        if(!clientX) return;

        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects([cube, ...trees.children], true);

        if (intersects.length > 0) {
            let obj = intersects[0].object;
            while(obj.parent && obj.parent !== scene && obj.parent !== trees) obj = obj.parent;
            transformControl.attach(obj);
        }
    };

    window.addEventListener('mousedown', onSelect);
    window.addEventListener('touchstart', onSelect);

    // الأزرار
    document.getElementById('modeTranslate').onclick = (e) => { transformControl.setMode('translate'); updateUI(e.target); };
    document.getElementById('modeScale').onclick = (e) => { transformControl.setMode('scale'); updateUI(e.target); };
    document.getElementById('changeTrees').onclick = addTrees;
    document.getElementById('changeGround').onclick = () => ground.material.color.setHex(Math.random() * 0xffffff);
    document.getElementById('deleteObject').onclick = () => { if(transformControl.object) { let o = transformControl.object; transformControl.detach(); o.parent.remove(o); } };

    function updateUI(btn) {
        document.getElementById('modeTranslate').classList.remove('active-mode');
        document.getElementById('modeScale').classList.remove('active-mode');
        btn.classList.add('active-mode');
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
