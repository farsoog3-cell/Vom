<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine Pro | v3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --primary: #deff9a; --bg: #111; --panel: #1a1a1a; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; }
        
        /* شريط الأدوات العلوي */
        .toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--panel); padding: 10px 20px; border-radius: 50px;
            display: flex; gap: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10;
        }
        .tool-btn {
            background: #222; border: 1px solid #444; color: white; padding: 8px 15px;
            border-radius: 25px; cursor: pointer; font-size: 13px; transition: 0.2s;
        }
        .tool-btn:hover, .tool-btn.active { background: var(--primary); color: black; border-color: var(--primary); }

        /* القوائم الجانبية */
        .sidebar {
            position: absolute; top: 80px; right: 20px; width: 240px;
            background: var(--panel); padding: 20px; border-radius: 15px;
            border: 1px solid #333; z-index: 10;
        }
        .left-menu { left: 20px; right: auto; }

        .section-title { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .control-group { margin-bottom: 20px; }
        
        input[type="color"] { width: 100%; height: 35px; border: none; border-radius: 5px; background: none; cursor: pointer; }
        
        #viewport { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="tool-btn active" onclick="setMode('translate', this)">تحريك (G)</button>
        <button class="tool-btn" onclick="setMode('rotate', this)">تدوير (R)</button>
        <button class="tool-btn" onclick="setMode('scale', this)">تحجيم (S)</button>
        <div style="width: 1px; background: #444; margin: 0 5px;"></div>
        <button class="tool-btn" onclick="addShape('cube')" style="background: #333;">+ مكعب</button>
        <button class="tool-btn" onclick="addShape('sphere')" style="background: #333;">+ كرة</button>
    </div>

    <div class="sidebar left-menu">
        <span class="section-title">العناصر (Hierarchy)</span>
        <div id="object-list" style="font-size: 13px; color: #ccc;">انقر على مجسم لاختياره</div>
    </div>

    <div class="sidebar">
        <span class="section-title">الخصائص (Inspector)</span>
        <div class="control-group">
            <label style="font-size: 12px;">لون المجسم:</label>
            <input type="color" id="colorPicker" oninput="changeColor(this.value)">
        </div>
        <div class="control-group">
            <label style="font-size: 12px;">الموقع:</label>
            <div id="pos-display" style="font-family: monospace; color: var(--primary); font-size: 12px; margin-top:5px;">X:0 Y:0 Z:0</div>
        </div>
        <button onclick="deleteObject()" style="width:100%; background:#ff4444; border:none; color:white; padding:8px; border-radius:5px; cursor:pointer;">حذف العنصر</button>
    </div>

    <div id="viewport"></div>

<script>
    let scene, camera, renderer, orbit, transform, raycaster, mouse;
    let selectedObject = null;
    const objects = [];

    init();

    function init() {
        const container = document.getElementById('viewport');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // الإضاءة
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const light = new THREE.PointLight(0xffffff, 1);
        light.position.set(10, 10, 10);
        scene.add(light);

        // الأرضية
        const grid = new THREE.GridHelper(20, 20, 0x333333, 0x222222);
        scene.add(grid);

        // التحكم
        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
        transform.addEventListener('change', updateInfo);

        // نظام النقر (Raycasting)
        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        window.addEventListener('mousedown', onMouseDown);

        // إضافة أول مكعب
        addShape('cube');

        animate();
    }

    function addShape(type) {
        let geo;
        if(type === 'cube') geo = new THREE.BoxGeometry(2, 2, 2);
        else if(type === 'sphere') geo = new THREE.SphereGeometry(1.2, 32, 32);
        
        const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 1;
        scene.add(mesh);
        objects.push(mesh);
        selectObject(mesh);
    }

    function onMouseDown(event) {
        if (event.target.tagName !== 'CANVAS') return;
        
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(objects);

        if (intersects.length > 0) {
            selectObject(intersects[0].object);
        }
    }

    function selectObject(obj) {
        selectedObject = obj;
        transform.attach(obj);
        document.getElementById('colorPicker').value = '#' + obj.material.color.getHexString();
        updateInfo();
    }

    function setMode(mode, btn) {
        transform.setMode(mode);
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function changeColor(hex) {
        if (selectedObject) selectedObject.material.color.set(hex);
    }

    function updateInfo() {
        if (selectedObject) {
            const p = selectedObject.position;
            document.getElementById('pos-display').innerText = `X:${p.x.toFixed(2)} Y:${p.y.toFixed(2)} Z:${p.z.toFixed(2)}`;
        }
    }

    function deleteObject() {
        if (selectedObject) {
            transform.detach();
            scene.remove(selectedObject);
            objects.splice(objects.indexOf(selectedObject), 1);
            selectedObject = null;
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
