<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | Modular Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
</head>
<body>

    <div class="toolbar">
        <div class="logo">NEO-ENGINE</div>
        <button class="btn" onclick="openLibrary('shapes')">📦 الأشكال</button>
        <button class="btn" onclick="openLibrary('nature')">🌳 الطبيعة</button>
        <button class="btn" onclick="openLibrary('assets')">🏯 موديلات خاصة</button>
        <div style="flex-grow: 1;"></div>
        <button class="btn delete-btn" onclick="deleteSelected()">🗑️ حذف</button>
    </div>

    <div id="library-modal" class="modal">
        <div class="modal-header">
            <span id="modal-title">المكتبة</span>
            <span class="close" onclick="closeLibrary()">×</span>
        </div>
        <div id="library-content" class="modal-body">
            </div>
    </div>

    <div class="gizmo-tools">
        <button class="btn active" id="m-t" onclick="setGizmoMode('translate')">تحريك</button>
        <button class="btn" id="m-r" onclick="setGizmoMode('rotate')">تدوير</button>
        <button class="btn" id="m-s" onclick="setGizmoMode('scale')">تحجيم</button>
    </div>

    <div id="viewport"></div>

    <script src="library.js"></script>
    <script src="engine.js"></script>
</body>
</html>
