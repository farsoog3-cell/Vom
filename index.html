<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo-Engine Pro | المحرك المتطور</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    
    <style>
        :root {
            --bg: #1a1a1a;
            --panel: #252526;
            --accent: #deff9a;
            --border: #3c3c3c;
            --text: #cccccc;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; }

        /* شاشة التحميل */
        #splash {
            position: fixed; inset: 0; background: #0b0b0b; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .splash-box { background: var(--panel); padding: 40px; border-radius: 15px; border: 1px solid var(--accent); text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }

        /* الواجهة الرئيسية */
        .editor-container {
            display: grid;
            grid-template-columns: 240px 1fr 280px;
            grid-template-rows: 45px 1fr 25px;
            height: 100vh;
            visibility: hidden;
        }

        header { grid-area: 1 / 1 / 2 / 4; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; gap: 15px; }
        .sidebar { background: var(--panel); border: 1px solid var(--border); padding: 10px; overflow-y: auto; }
        .hierarchy { grid-area: 2 / 1 / 3 / 2; }
        .viewport { grid-area: 2 / 2 / 3 / 3; background: #333; position: relative; }
        .inspector { grid-area: 2 / 3 / 3 / 4; }
        footer { grid-area: 3 / 1 / 4 / 4; background: #007acc; color: white; font-size: 11px; display: flex; align-items: center; padding: 0 10px; }

        /* أزرار وأدوات */
        .btn { background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .tool-btn { background: #444; color: white; border: 1px solid #666; padding: 5px 10px; cursor: pointer; }
        .active-tool { background: var(--accent); color: black; }
        
        .obj-item { padding: 8px; background: #333; margin-bottom: 5px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .obj-item:hover { background: #444; }

        .prop-group { margin-bottom: 15px; padding: 10px; background: #1e1e1e; border-radius: 5px; }
        input[type="number"] { width: 50px; background: #000; border: 1px solid #555; color: var(--accent); padding: 3px; }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-box">
        <h1 style="color: var(--accent); margin: 0; letter-spacing: 3px;">NEO-ENGINE PRO</h1>
        <input type="text" id="p-name" placeholder="اسم مشروعك الجديد..." style="padding: 12px; width: 250px; margin: 20px 0; border-radius: 5px; border: none;">
        <br>
        <button class="btn" style="padding: 12px 40px;" onclick="initEngine()">تحميل البيئة</button>
    </div>
</div>

<div class="editor-container" id="editor">
    <header>
        <div style="color: var(--accent); font-weight: bold; font-size: 18px;">NEO</div>
        <button class="btn" onclick="spawnObject('cube')">+ مكعب</button>
        <button class="btn" onclick="spawnObject('sphere')">+ كرة</button>
        <button class="btn" onclick="spawnObject('plane')">+ أرضية</button>
        <div style="flex-grow: 1;"></div>
        <button class="btn" style="background: #444; color: white;" onclick="saveProject()">حفظ</button>
    </header>

    <aside class="sidebar hierarchy">
        <div style="font-size: 12px; color: #888; margin-bottom: 10px;">شجرة العناصر (Hierarchy)</div>
        <div id="hierarchy-list"></div>
    </aside>

    <main class="viewport" id="v-port">
        <div style="position: absolute; top: 10px; left: 10px; display: flex; gap: 5px;">
            <button class="tool-btn active-tool" id="btn-t" onclick="changeMode('translate')">تحريك (W)</button>
            <button class="tool-btn" id="btn-r" onclick="changeMode('rotate')">تدوير (E)</button>
            <button class="tool-btn" id="btn-s" onclick="changeMode('scale')">تكبير (R)</button>
        </div>
    </main>

    <aside class="sidebar inspector">
        <div style="font-size: 12px; color: #888; margin-bottom: 10px;">المفتش (Inspector)</div>
        <div id="inspector-content">
            <p style="color: #666; text-align: center;">اختر جسماً لتعديله</p>
        </div>
    </aside>

    <footer>
        <span>محرك نيو برو v2.0</span>
        <span style="margin-right: 20px;">حالة الذاكرة: مستقرة</span>
    </footer>
</div>

<script>
    let scene, camera, renderer, controls, transformControls;
    let objects = [];
    let selectedObject = null;

    function initEngine() {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('editor').style.visibility = 'visible';
        
        setup3D();
        setupShortcuts();
    }

    function setup3D() {
        const container = document.getElementById('v-port');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x282828);

        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(8, 8, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        // الشبكة (Grid)
        const grid = new THREE.GridHelper(30, 30, 0x444444, 0x333333);
        scene.add(grid);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);
        
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 15, 10);
        sun.castShadow = true;
        scene.add(sun);

        // أدوات التحويل (Gizmo)
        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transformControls);
        
        transformControls.addEventListener('dragging-changed', (e) => {
            controls.enabled = !e.value;
        });

        transformControls.addEventListener('change', updateInspectorUI);

        spawnObject('cube'); // إضافة مكعب افتراضي عند البدء
        animate();
    }

    function spawnObject(type) {
        let geometry, material, mesh;
        material = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });

        if(type === 'cube') geometry = new THREE.BoxGeometry(1, 1, 1);
        if(type === 'sphere') geometry = new THREE.SphereGeometry(0.7, 32, 32);
        if(type === 'plane') {
            geometry = new THREE.PlaneGeometry(10, 10);
            material = new THREE.MeshPhongMaterial({ color: 0x555555, side: THREE.DoubleSide });
        }

        mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.name = type + "_" + objects.length;
        
        scene.add(mesh);
        objects.push(mesh);
        selectObject(mesh);
        updateHierarchy();
    }

    function selectObject(obj) {
        selectedObject = obj;
        transformControls.attach(obj);
        updateInspectorUI();
    }

    function updateHierarchy() {
        const list = document.getElementById('hierarchy-list');
        list.innerHTML = "";
        objects.forEach(obj => {
            const div = document.createElement('div');
            div.className = "obj-item";
            div.innerHTML = "📦 " + obj.name;
            div.onclick = () => selectObject(obj);
            list.appendChild(div);
        });
    }

    function updateInspectorUI() {
        if(!selectedObject) return;
        const ins = document.getElementById('inspector-content');
        ins.innerHTML = `
            <div class="prop-group">
                <b>${selectedObject.name}</b>
                <hr style="border:0; border-top:1px solid #333">
                <p>الموقع (Transform)</p>
                X: <input type="number" step="0.1" value="${selectedObject.position.x.toFixed(2)}" oninput="manualMove('x', this.value)">
                Y: <input type="number" step="0.1" value="${selectedObject.position.y.toFixed(2)}" oninput="manualMove('y', this.value)">
                Z: <input type="number" step="0.1" value="${selectedObject.position.z.toFixed(2)}" oninput="manualMove('z', this.value)">
            </div>
            <button class="btn" style="background:#ff4444; color:white; width:100%" onclick="deleteSelected()">حذف العنصر</button>
        `;
    }

    function manualMove(axis, val) {
        selectedObject.position[axis] = parseFloat(val);
    }

    function changeMode(mode) {
        transformControls.setMode(mode);
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
        if(mode === 'translate') document.getElementById('btn-t').classList.add('active-tool');
        if(mode === 'rotate') document.getElementById('btn-r').classList.add('active-tool');
        if(mode === 'scale') document.getElementById('btn-s').classList.add('active-tool');
    }

    function deleteSelected() {
        if(selectedObject) {
            scene.remove(selectedObject);
            transformControls.detach();
            objects = objects.filter(o => o !== selectedObject);
            selectedObject = null;
            updateHierarchy();
            document.getElementById('inspector-content').innerHTML = "تم الحذف";
        }
    }

    function setupShortcuts() {
        window.addEventListener('keydown', (e) => {
            if(e.key === 'w') changeMode('translate');
            if(e.key === 'e') changeMode('rotate');
            if(e.key === 'r') changeMode('scale');
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        const container = document.getElementById('v-port');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
