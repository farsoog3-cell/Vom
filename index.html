<div id="ui-container">
    <div id="sidebar">
        <h3>وضع العرض</h3>
        <div class="mode-selector">
            <button onclick="setViewport('pc')">🖥️ كمبيوتر</button>
            <button onclick="setViewport('mobile')">📱 هاتف</button>
        </div>

        <div class="section">
            <h3>إضافة كائنات</h3>
            <div class="btn-grid">
                <button onclick="addCube()">+ مكعب</button>
                <button onclick="addSphere()">+ كرة</button>
            </div>
        </div>

        <div class="section" id="inspector">
            <h3>الموقع (Position)</h3>
            <div class="transform-group">
                <div class="axis-row"><label>X</label><input type="range" id="pos-x" min="-10" max="10" step="0.1" value="0"><span id="val-pos-x">0</span></div>
                <div class="axis-row"><label>Y</label><input type="range" id="pos-y" min="0" max="10" step="0.1" value="0.5"><span id="val-pos-y">0.5</span></div>
                <div class="axis-row"><label>Z</label><input type="range" id="pos-z" min="-10" max="10" step="0.1" value="0"><span id="val-pos-z">0</span></div>
            </div>

            <h3>التدوير (Rotation)</h3>
            <div class="transform-group">
                <div class="axis-row"><label>X</label><input type="range" id="rot-x" min="0" max="6.28" step="0.1" value="0"></div>
                <div class="axis-row"><label>Y</label><input type="range" id="rot-y" min="0" max="6.28" step="0.1" value="0"></div>
                <div class="axis-row"><label>Z</label><input type="range" id="rot-z" min="0" max="6.28" step="0.1" value="0"></div>
            </div>

            <h3>التحجيم (Scale)</h3>
            <div class="transform-group">
                <div class="axis-row"><label>X</label><input type="range" id="scale-x" min="0.1" max="5" step="0.1" value="1"></div>
                <div class="axis-row"><label>Y</label><input type="range" id="scale-y" min="0.1" max="5" step="0.1" value="1"></div>
                <div class="axis-row"><label>Z</label><input type="range" id="scale-z" min="0.1" max="5" step="0.1" value="1"></div>
            </div>
        </div>

        <button id="play-btn" onclick="togglePlayMode()" style="width:100%; background:var(--accent); font-weight:bold;">تشغيل المحرك</button>
    </div>
    <div id="renderer-container"></div>
</div>
