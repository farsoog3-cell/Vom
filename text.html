<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Neo-Engine | بيئة التصنيع ثلاثية الأبعاد</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; color: white; font-family: sans-serif; }
        
        /* شاشة الدخول */
        #splash {
            position: fixed; inset: 0; background: #0a0a0a; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .input-box { background: #222; padding: 30px; border-radius: 15px; border: 1px solid #deff9a; text-align: center; }
        input { padding: 12px; width: 250px; border-radius: 5px; border: none; margin: 15px 0; font-size: 16px; }
        
        /* واجهة المحرك */
        .layout { display: grid; grid-template-columns: 200px 1fr 250px; height: 100vh; visibility: hidden; }
        .sidebar { background: #202020; padding: 15px; border: 1px solid #333; }
        #canvas-container { background: #393939; position: relative; } /* لون خلفية بلندر */
        
        .btn { background: #deff9a; color: black; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="splash">
    <div class="input-box">
        <h1 style="color: #deff9a;">NEO-ENGINE</h1>
        <input type="text" id="pName" placeholder="اسم اللعبة...">
        <br>
        <button class="btn" onclick="start()">بدء التصنيع</button>
    </div>
</div>

<div class="layout" id="editor">
    <aside class="sidebar">
        <h4 style="color: #deff9a;">Hierarchy</h4>
        <p>📦 Cube</p>
    </aside>
    
    <main id="canvas-container"></main>
    
    <aside class="sidebar">
        <h4 style="color: #deff9a;">Inspector</h4>
        <label>تحريك X:</label>
        <input type="range" min="-5" max="5" step="0.1" value="0" oninput="updateCube(this.value)">
    </aside>
</div>

<script>
    let scene, camera, renderer, cube, controls;

    function start() {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('editor').style.visibility = 'visible';
        init3D();
    }

    function init3D() {
        const container = document.getElementById('canvas-container');

        // 1. إنشاء المشهد (Scene)
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x393939); // خلفية رمادية مثل بلندر

        // 2. الكاميرا (Camera)
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        // 3. المحرك (Renderer)
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // 4. الإضاءة (Lights) - ضرورية لظهور الأبعاد
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        // 5. الأرضية الشبكية (Grid) - كما في بلندر
        const grid = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
        scene.add(grid);

        // 6. المكعب ثلاثي الأبعاد (The Cube)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshPhongMaterial({ color: 0xdeff9a });
        cube = new THREE.Mesh(geometry, material);
        cube.position.y = 0.5; // رفعه فوق الشبكة
        scene.add(cube);

        // 7. تحريك الكاميرا (Orbit Controls)
        controls = new THREE.OrbitControls(camera, renderer.domElement);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    function updateCube(val) {
        if(cube) cube.position.x = parseFloat(val);
    }

    // جعل الشاشة تتكيف مع تغيير حجم المتصفح
    window.addEventListener('resize', () => {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
